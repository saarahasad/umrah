<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Preparing for Umrah</title>
<meta name="description" content="Preparing for Umrah — notes from the Umrah preparation series.">
<meta name="theme-color" content="#F9DCE5">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon-64.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Umrah">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Figtree:wght@400;500;600;700&family=Marcellus&display=swap">
<style>
@font-face{font-family:"Uthmanic Hafs";src:url("fonts/uthmanic-hafs.woff2") format("woff2");font-display:swap}
:root{
  --bg:#FFF7F9; --surface:#FFFFFF; --surface-2:#FEF0F4; --ink:#3B2A31; --muted:#8B7078; --line:#F2DCE3;
  --blush:#F9DCE5; --blush-2:#FBE8EE; --rose:#E7A9BC; --rose-deep:#C0677F; --rose-ink:#8C3A55;
  --parch:#FCF4E4; --parch-ink:#4A3A1E;
  --fs:17px;
  --display:"Marcellus", "Cormorant Garamond", Georgia, serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --arabic:"Uthmanic Hafs", "Amiri", "Traditional Arabic", serif;
  --tabh:64px;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--rose-deep);outline-offset:2px;border-radius:6px}
[hidden]{display:none!important}
.ar{font-family:var(--arabic);direction:rtl;text-align:right;line-height:2.25}
.ari{font-family:var(--arabic);font-size:1.15em;direction:rtl;unicode-bidi:isolate}

/* App bar */
.appbar{position:sticky;top:0;z-index:20;background:var(--blush);padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 10px;display:flex;align-items:center;gap:12px}
.appbar .brand{font-family:var(--display);font-size:21px;letter-spacing:.02em;flex:1;color:var(--ink)}
.appbar .nm{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.appbar .nm-ar{font-family:var(--arabic);font-size:22px;color:var(--rose-ink);line-height:1}
.appbar .brand small{display:block;font-family:var(--body);font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--rose-deep)}
.iconbtn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--rose-ink)}
.iconbtn:active{background:rgba(140,58,85,.08)}
.iconbtn svg{width:22px;height:22px}

main{padding:0 16px calc(var(--tabh) + env(safe-area-inset-bottom,0px) + 28px);max-width:720px;margin:0 auto}
.view{display:flex;flex-direction:column;gap:22px;padding-top:18px}

/* Hero */
.hero{margin:-18px -16px 0;background:var(--blush);padding:4px 20px 28px;border-radius:0 0 32px 32px}
.hero-grid{display:grid;gap:4px;align-items:center;max-width:720px;margin:0 auto}
.mataf{width:min(290px,76vw);aspect-ratio:1;margin:0 auto;display:block;max-width:100%}
.mataf .spin{transform-origin:100px 100px;animation:ccw 60s linear infinite}
@keyframes ccw{to{transform:rotate(-360deg)}}
@media (prefers-reduced-motion:reduce){.mataf .spin{animation:none}}
.hero .ar-title{font-size:30px;color:var(--rose-ink);text-align:center;line-height:1.8;margin:0}
.hero .en-title{text-align:center;font-family:var(--display);font-size:15.5px;letter-spacing:.04em;margin:0}
.hero .ref{text-align:center;font-size:11.5px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--rose-deep);margin:2px 0 0}
.circuits{display:flex;justify-content:center;align-items:baseline;gap:8px;margin-top:14px;font-variant-numeric:tabular-nums;flex-wrap:wrap;text-align:center}
.circuits b{font-family:var(--display);font-size:34px;font-weight:400;color:var(--rose-ink)}
.circuits span{font-size:13.5px;color:var(--muted)}

.label{font-size:11.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--rose-deep);margin:0}
.h-display{font-family:var(--display);font-weight:400;font-size:26px;line-height:1.2;margin:0;text-wrap:balance}
.stack{display:flex;flex-direction:column;gap:10px}

/* Home cards */
.continue{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 16px;text-align:left;width:100%}
.continue .num{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-size:20px;color:var(--d);background:var(--c)}
.continue .t{font-weight:600;font-size:16px;line-height:1.3}
.continue .s{font-size:13px;color:var(--muted)}
.continue svg{width:20px;height:20px;color:var(--rose)}
.prep{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.prep div{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.prep b{display:block;font-family:var(--display);font-weight:400;font-size:18px;color:var(--rose-ink)}
.prep span{font-size:13px;color:var(--muted);line-height:1.4;display:block}
@media (min-width:560px){.prep{grid-template-columns:repeat(4,1fr)}}

/* Chapter list */
.part-head{display:flex;flex-direction:column;gap:4px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.part-head .meta{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.part-head .meta span{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.chlist{display:flex;flex-direction:column;gap:10px;list-style:none;margin:0;padding:0}
.ch{display:grid;grid-template-columns:52px 1fr 26px;gap:14px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px 14px 12px 12px}
.ch .no{width:52px;height:52px;border-radius:14px;background:var(--c);color:var(--d);display:grid;place-items:center;font-family:var(--display);font-size:22px}
.ch .tt{font-weight:600;font-size:16px;line-height:1.3;display:block}
.ch .ss{font-size:13.5px;color:var(--muted);line-height:1.4;margin-top:2px;display:block}
.ch .tick{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center}
.ch.done .tick{background:var(--rose-deep);border-color:var(--rose-deep);color:#fff}
.ch .tick svg{width:15px;height:15px}
.coming{border:1.5px dashed var(--rose);border-radius:18px;padding:16px;color:var(--muted);font-size:14px;text-align:center}

/* Reader */
.reader{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.r-bar{position:sticky;top:0;z-index:2;background:var(--c);color:var(--d);padding:calc(env(safe-area-inset-top,0px) + 8px) 8px 8px;display:flex;align-items:center;gap:6px}
.r-bar .iconbtn{color:var(--d)}
.r-bar .where{flex:1;font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;text-align:center}
.r-prog{position:sticky;top:calc(env(safe-area-inset-top,0px) + 56px);z-index:2;height:3px;background:var(--line)}
.r-prog i{display:block;height:100%;width:0;background:var(--d)}
.r-head{background:var(--c);color:var(--d);padding:14px 20px 30px;border-radius:0 0 28px 28px}
.r-head .inner{max-width:680px;margin:0 auto}
.r-head .n{font-family:var(--display);font-size:54px;line-height:1;opacity:.4}
.r-head h1{font-family:var(--display);font-weight:400;font-size:32px;line-height:1.15;margin:6px 0 8px;text-wrap:balance;color:var(--ink)}
.r-head p{margin:0;font-size:15px;color:var(--ink);opacity:.8}
.r-body{max-width:680px;margin:0 auto;padding:26px 16px calc(40px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:18px;font-size:var(--fs)}
.r-body p{margin:0;line-height:1.7}
.r-body h3{font-family:var(--display);font-weight:400;font-size:1.35em;line-height:1.25;margin:10px 0 -4px;display:flex;gap:12px;align-items:baseline;text-wrap:balance}
.r-body h3 .badge{flex:none;font-family:var(--body);font-size:12px;font-weight:700;width:28px;height:28px;border-radius:50%;display:inline-grid;place-items:center;background:var(--c);color:var(--d);transform:translateY(-3px)}
.r-body ul{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:8px;line-height:1.6}
.r-body li::marker{color:var(--d)}

.box{border-radius:18px;padding:18px 18px 16px;display:flex;flex-direction:column;gap:10px}
.box .kind{font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase}
.box .ar{font-size:1.5em;margin:0}
.box .en{font-size:.97em;line-height:1.65}
.box .src{font-size:12.5px;letter-spacing:.03em;opacity:.8}
.quran{background:var(--parch);color:var(--parch-ink);border:1px solid #EEDDB8}
.quran .kind{color:#A07A30}
.hadith{background:color-mix(in srgb,var(--c) 45%,#fff);border:1px solid var(--c)}
.hadith .kind{color:var(--d)}
.dua{background:var(--blush);color:var(--ink);border:1px solid var(--rose)}
.dua .kind{color:var(--rose-deep)}
.dua .ar{color:var(--rose-ink)}
.key{border-left:4px solid var(--d);background:var(--surface);border-radius:4px 16px 16px 4px;padding:14px 16px;font-weight:500;line-height:1.6}
.story{background:var(--surface);border:1.5px dashed var(--line);border-radius:18px;padding:16px 18px;display:flex;flex-direction:column;gap:8px}
.story .kind{font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.story p{line-height:1.65}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips span{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:.9em;font-weight:500}
.chips span b{color:var(--d);font-weight:700}
.all{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.all div{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.all b{display:block;font-family:var(--display);font-weight:400;font-size:1.1em;color:var(--d)}
.all span{font-size:.85em;color:var(--muted);line-height:1.45;display:block}
.yn{display:flex;flex-direction:column;gap:8px}
.yn div{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;line-height:1.5;font-size:.95em}
.yn i{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-weight:700;font-size:14px}
.yn .ok i{background:#D6EFE3;color:#2B7152}
.yn .no i{background:#F9D6DF;color:#A3435D}
.cta{background:var(--blush);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:12px}
.cta h4{margin:0;font-family:var(--display);font-weight:400;font-size:1.3em;color:var(--rose-ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 20px;border-radius:999px;font-weight:600;font-size:15px;text-align:center}
.btn.rose{background:var(--rose-deep);color:#fff}
.btn.ghost{border:1.5px solid var(--line);background:var(--surface)}
.r-end{display:flex;flex-direction:column;gap:12px;padding-top:14px;border-top:1px solid var(--line);margin-top:8px}
.r-end .row{display:flex;gap:10px;flex-wrap:wrap}
.r-end .row .btn{flex:1 1 150px}
.done-note{text-align:center;color:var(--muted);font-size:14px}
.pack{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.pack button{display:flex;align-items:center;gap:10px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;font-size:.9em;font-weight:500;min-height:46px}
.pack i{flex:none;width:22px;height:22px;border-radius:7px;border:1.5px solid var(--rose);display:grid;place-items:center;color:#fff}
.pack i svg{width:13px;height:13px;opacity:0}
.pack button[aria-pressed="true"]{background:var(--blush-2)}
.pack button[aria-pressed="true"] i{background:var(--rose-deep);border-color:var(--rose-deep)}
.pack button[aria-pressed="true"] i svg{opacity:1}

.steps{list-style:none;margin:0;padding:0;counter-reset:st;display:flex;flex-direction:column;gap:0}
.steps li{counter-increment:st;display:grid;grid-template-columns:40px 1fr;column-gap:14px;padding-bottom:18px;position:relative}
.steps li::before{content:counter(st);grid-row:span 2;width:40px;height:40px;border-radius:50%;background:var(--c);color:var(--d);display:grid;place-items:center;font-family:var(--display);font-size:19px}
.steps li:not(:last-child)::after{content:"";position:absolute;left:19px;top:44px;bottom:2px;width:2px;background:var(--c)}
.steps b{font-family:var(--display);font-weight:400;font-size:1.2em;line-height:1.3;padding-top:6px}
.steps span{line-height:1.6;font-size:.95em;color:var(--ink)}
.plan{display:flex;flex-direction:column;gap:8px}
.round{display:grid;grid-template-columns:34px 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px 10px 8px 8px}
.round .rn{width:34px;height:34px;border-radius:50%;background:var(--c);color:var(--d);display:grid;place-items:center;font-family:var(--display);font-size:17px}
.round .rl{font-weight:600;font-size:.95em}
.round select{font:inherit;font-size:15px;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0;max-width:44vw}

/* Memorise */
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px;gap:4px}
.seg button{flex:1;min-height:38px;border-radius:999px;font-size:14px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--rose-deep);color:#fff}
.mem-stat{display:flex;justify-content:space-between;align-items:baseline;font-variant-numeric:tabular-nums;gap:12px}
.mem-stat b{font-family:var(--display);font-weight:400;font-size:28px;color:var(--rose-ink)}
.mem-stat span{color:var(--muted)}
.mcard{background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden;display:flex;flex-direction:column}
.mcard .top{padding:14px 16px 0}
.mcard .top .kind{font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--rose-deep)}
.mcard .top h4{margin:2px 0 0;font-size:15.5px;font-weight:600;line-height:1.3}
.mcard .arw{margin:0;padding:8px 18px 4px;font-size:25px;color:var(--rose-ink);cursor:pointer}
.mcard .enw{margin:0;padding:0 18px 12px;font-size:15px;line-height:1.6;cursor:pointer}
.mcard .why{margin:0 16px 14px;font-size:13.5px;color:var(--muted);line-height:1.5;border-top:1px solid var(--line);padding-top:10px}
.mcard .why b{color:var(--ink);font-weight:600}
.mcard .foot{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 16px;background:var(--surface-2);border-top:1px solid var(--line)}
.mcard .foot .src{font-size:12.5px;color:var(--muted)}
.mbtn{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 14px;border-radius:999px;border:1.5px solid var(--rose);font-size:13.5px;font-weight:600;color:var(--rose-ink);background:var(--surface);flex:none}
.mbtn svg{width:15px;height:15px}
.mcard.got .mbtn{background:var(--rose-deep);border-color:var(--rose-deep);color:#fff}
.blur{filter:blur(7px);user-select:none;transition:filter .2s}
.hint{font-size:13px;color:var(--muted);text-align:center;margin:0}

/* Du'a list */
.intro{background:var(--blush);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:8px;line-height:1.6;font-size:15px}
.intro .kind{font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--rose-deep)}
.adder{display:flex;flex-direction:column;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:14px}
.adder textarea{width:100%;min-height:70px;resize:vertical;border:1px solid var(--line);border-radius:14px;background:var(--surface-2);color:var(--ink);font:inherit;font-size:16px;padding:10px 12px}
.adder .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.adder .seg{flex:1 1 220px}
.adder .seg button{font-size:13px}
.prompts{display:flex;flex-wrap:wrap;gap:6px}
.prompts button{border:1px dashed var(--rose);border-radius:999px;padding:5px 11px;font-size:12.5px;color:var(--rose-ink)}
.dgroup{display:flex;flex-direction:column;gap:8px}
.ditem{display:grid;grid-template-columns:30px 1fr 34px;gap:12px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px}
.ditem .chk{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--rose);display:grid;place-items:center}
.ditem .chk svg{width:15px;height:15px;opacity:0}
.ditem.asked .chk{background:var(--rose-deep);border-color:var(--rose-deep);color:#fff}
.ditem.asked .chk svg{opacity:1}
.ditem .tx{line-height:1.5;padding-top:3px;overflow-wrap:anywhere}
.ditem.asked .tx{color:var(--muted)}
.ditem .del{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.ditem .del svg{width:17px;height:17px}
.empty{text-align:center;color:var(--muted);font-size:14px;padding:6px 0;margin:0}

/* Tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(env(safe-area-inset-bottom,0px) + 6px);display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;min-height:52px;justify-content:center;font-size:11.5px;font-weight:600;color:var(--muted);border-radius:14px}
.tabs button svg{width:23px;height:23px}
.tabs button[aria-selected="true"]{color:var(--rose-ink);background:var(--blush-2)}
.tabs button[aria-selected="true"] svg{color:var(--rose-deep)}

/* Sheet */
.scrim{position:fixed;inset:0;background:rgba(59,42,49,.35);z-index:50}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;background:var(--surface);border-radius:24px 24px 0 0;padding:10px 20px calc(env(safe-area-inset-bottom,0px) + 22px);display:flex;flex-direction:column;gap:18px;max-width:720px;margin:0 auto}
.sheet .grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:0 auto}
.sheet h2{font-family:var(--display);font-weight:400;margin:0;font-size:24px}
.size{display:flex;align-items:center;gap:14px}
.size input{flex:1;accent-color:var(--rose-deep)}
.size span{font-family:var(--display)}
.danger{color:#B3261E;font-size:14px;font-weight:600;align-self:flex-start;padding:6px 0}
.confirm{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:14px}
.toast{position:fixed;left:50%;bottom:calc(var(--tabh) + env(safe-area-inset-bottom,0px) + 18px);transform:translateX(-50%);background:var(--rose-ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;z-index:60;box-shadow:0 6px 20px rgba(140,58,85,.25);white-space:nowrap}
</style>
</head>
<body>

<header class="appbar">
  <div class="brand"><span class="nm">Preparing for Umrah</span><small>Notes from the lecture series</small></div>
  <button class="iconbtn" id="openSettings" aria-label="Settings">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
  </button>
</header>

<main id="main">
  <section class="view" id="v-home"></section>
  <section class="view" id="v-chapters" hidden></section>
  <section class="view" id="v-memorise" hidden></section>
  <section class="view" id="v-list" hidden></section>
</main>

const PAL = {
  mint:["#D3EFE7","#2E7566"], peri:["#DCE1F8","#43539F"], rose:["#F9D6DF","#A3435D"], sage:["#E0EACF","#566D32"],
  butter:["#F7E9BC","#86661A"], sky:["#D5E7F6","#2E5F8C"], lilac:["#E8DCF4","#6A4996"], peach:["#FBDFCC","#9E5527"],
  aqua:["#CFECF0","#28707E"], blush:["#F8D9E8","#963D6A"], sand:["#F1E4D2","#7A5A34"]
};
const ari = s=>`<span class="ari">${s}</span>`;

const PARTS = [
{
  id:"p1", num:"Part One", title:"Understanding Umrah", session:"Session 1",
  chapters:[
  {
    id:"c1", title:"Preparing for the Journey", color:PAL.mint,
    summary:"Why this journey needs preparation before you set out.",
    blocks:[
      {t:"p",h:"Out of so many people, Allah ﷻ has given you the ability and the opportunity to make the intention for Umrah and to prepare for this journey. That in itself is a huge blessing."},
      {t:"dua",kind:"Each session opens with",ar:"رَبِّ اشْرَحْ لِي صَدْرِي ۝ وَيَسِّرْ لِي أَمْرِي ۝ وَاحْلُلْ عُقْدَةً مِّن لِّسَانِي ۝ يَفْقَهُوا قَوْلِي — اللَّهُمَّ اهْدِ قَلْبِي وَسَدِّدْ لِسَانِي وَاسْلُلْ سَخِيمَةَ قَلْبِي",en:"My Lord, expand for me my chest, ease for me my task, and untie the knot from my tongue so they may understand my speech. O Allah, guide my heart, make my tongue firm and true, and remove the resentment from my heart."},
      {t:"p",h:"Whenever a person travels somewhere, they must prepare in advance. If they do not prepare mentally and physically, and do not prepare their supplies for the journey, they feel lost. They feel their time is being wasted and that they are missing a huge opportunity. They are not able to make the most of it the way they could have, had they been better prepared."},
      {t:"key",h:"We do not want to be of those who regret. We want to be fully prepared for this journey."},
      {t:"all",items:[["Spiritually","Your heart and intention"],["Mentally","Ready for what the journey asks"],["Physically","Your body and your supplies"],["Informationally","The knowledge of what to do"]]},
      {t:"p",h:"So this series begins with the foundations: what Umrah is, its significance, its reward, why we want to go, and how we can prepare."},
      {t:"dua",kind:"A du'a for you",en:"May Allah facilitate it for you in every single step of the way. May this journey be a means of forgiveness, a means of increase in many, many rewards, and a means of drawing ever closer to Allah ʿazza wa jall. Āmīn."}
    ]
  },
  {
    id:"c2", title:"What Umrah Is", color:PAL.peri,
    summary:"The meaning of the word, and what it means in the Shariʿah.",
    blocks:[
      {t:"h",h:"In the language"},
      {t:"p",h:"Linguistically, <em>ʿumrah</em> means a visit: to visit a place that is inhabited. The word is also used for a visit that builds love and affection, where you visit someone in order to build better relations with them."},
      {t:"h",h:"In the Shariʿah"},
      {t:"p",h:"In the Shariʿah, the word Umrah refers to the minor pilgrimage. It is called so because it is a religious visit."},
      {t:"list",items:["It is not a visit to a city to take the perfect Instagrammable pictures.","It is not about eating at the fanciest of restaurants.","It is not a visit where a person is only concerned with their hotel and where they are going to dine."]},
      {t:"p",h:"The objective of this visit is to go to sacred places in Makkah and to perform certain rituals in the state of <em>iḥrām</em>:"},
      {t:"chips",items:["<b>Ṭawāf</b> around the Kaʿbah","<b>Saʿī</b> between aṣ-Ṣafā and al-Marwah"]},
      {t:"key",h:"Umrah is a religious visit to sacred places in Makkah, performing ṭawāf and saʿī in the state of iḥrām."}
    ]
  },
  {
    id:"c3", title:"Worship That Takes All of You", color:PAL.rose,
    summary:"Why Umrah is unlike any other act of worship, and why its reward is so great.",
    blocks:[
      {t:"h",h:"Only in one place on earth"},
      {t:"p",h:"Umrah is a very significant act of worship, and a unique one: it can only be performed in Makkah, in al-Masjid al-Ḥarām. You cannot perform Umrah anywhere else on earth."},
      {t:"p",h:"Salah you can pray in Makkah, on a plane, in Canada or in Greenland. Sadaqah and zakat you give wherever you are. Umrah has to be performed in Makkah."},
      {t:"h",h:"It requires every part of you"},
      {t:"p",h:"Umrah does not only involve certain actions, or only statements on the tongue, or only the heart. It requires all of you:"},
      {t:"all",items:[["Wealth","You spend from what you have"],["Time & travel","You journey to Makkah"],["Body","You walk around the Kaʿbah; men run in a certain area between Ṣafā and Marwah"],["Tongue","There are words you must say"],["Heart","Your heart has to be present"]]},
      {t:"h",h:"So its reward is huge"},
      {t:"list",items:["It is a means of forgiveness of sins.","It removes poverty, as the Prophet ﷺ said.","It is a means of drawing close to Allah.","It is a means of having our du'as accepted."]}
    ]
  },
  {
    id:"c4", title:"Answering the Call", color:PAL.sage,
    summary:"Going for Umrah is a response to the call Ibrahim عليه السلام was commanded to make.",
    blocks:[
      {t:"p",h:"When a person goes for Umrah or Hajj, they are actually responding to the call of Allah. Allah ﷻ commanded His Khalīl, Ibrahim عليه السلام:"},
      {t:"q",ar:"وَأَذِّن فِي النَّاسِ بِالْحَجِّ يَأْتُوكَ رِجَالًا وَعَلَىٰ كُلِّ ضَامِرٍ يَأْتِينَ مِن كُلِّ فَجٍّ عَمِيقٍ",en:"And proclaim to the people the pilgrimage. They will come to you on foot and on every lean camel; they will come from every distant pass.",ref:"Sūrat al-Ḥajj 22:27"},
      {t:"p",h:"There are two types of Hajj: the major Hajj, which is well known, and the minor Hajj, which is Umrah."},
      {t:"p",h:"Ibrahim عليه السلام had to make the announcement that people should come, visit the Kaʿbah and worship Allah there. When you go for Umrah, you are responding to that invitation."},
      {t:"key",h:"Being able to travel for Umrah is a huge privilege and an honour: you are able to respond to the call of Allah."}
    ]
  },
  {
    id:"c5", title:"Complete It for Allah", color:PAL.butter,
    summary:"One short ayah, and at least five meanings the ʿulamāʾ draw from it.",
    blocks:[
      {t:"p",h:"Umrah is mentioned in the Qur'an. Allah ﷻ tells us:"},
      {t:"q",ar:"وَأَتِمُّوا الْحَجَّ وَالْعُمْرَةَ لِلَّهِ",en:"And complete the Hajj and Umrah for Allah.",ref:"Sūrat al-Baqarah 2:196"},
      {t:"p",h:"It is mainly four words, yet the ʿulamāʾ interpret this ayah in at least five different ways."},
      {t:"h",n:1,h:"Purely for the sake of Allah"},
      {t:"p",h:"From the beginning until the end, your intention should be purely for Allah: to please Him, to draw closer to Him, and to have your sins forgiven, so that the barriers we have put up between ourselves and Allah are taken down."},
      {t:"p",h:"Umrah should not be done to impress people: <em>“I'm going for Umrah again this year”</em>, <em>“my whole family is going”</em>, <em>“I'm going with such-and-such group”</em>, <em>“as I do every six months.”</em>"},
      {t:"list",items:["If the intention is to impress people, the reward is wasted.","If the intention is to boast about one's wealth, the reward is wasted.","If the intention is to look good in the eyes of others and feel great about oneself, it is not purely for Allah."]},
      {t:"dua",kind:"The intention to carry",en:"Yā Allah, whatever I do, every step that I take, every cent that I spend, and every moment that I spend in preparing for this journey, in going on this journey and in performing this noble act of worship, I want to do it purely for You, so that You are pleased with me, You forgive me and You reward me."},
      {t:"h",n:2,h:"Once you begin, finish it"},
      {t:"p",h:"When you start Umrah, don't leave it halfway: <em>“I'm quite tired from the ṭawāf, so I think I'll just call it quits.”</em> No, you have to complete it. There are exceptional cases in which a person is allowed to exit the state of iḥrām, but those are very unusual circumstances. In general, once a person begins Umrah, they must complete it."},
      {t:"h",n:3,h:"Complete it properly"},
      {t:"p",h:"Perform it the way you should, the way the Prophet ﷺ taught. About the pilgrimage he said:"},
      {t:"hd",en:"“Take your rituals from me.” Meaning, learn them from me.",ref:"Ṣaḥīḥ Muslim"},
      {t:"p",h:"So in order to perform Umrah completely and properly, and to follow what Allah tells us in this ayah, we have to learn how to perform Umrah."},
      {t:"h",n:4,h:"Complete it with excellence"},
      {t:"p",h:"Some people do only the bare minimum, going down a list to check boxes. That is fine; they have completed it. But doing the bare minimum is one thing, and doing it at the level of excellence is another. Perform ṭawāf with excellence. Perform saʿī with excellence. From the beginning of the journey until the end, keep your tongue busy in the dhikr of Allah and in gratitude to Allah."},
      {t:"story",kind:"From the teacher",h:"<p>“I remember once I was going for Umrah and I wasn't that well at the time. My mother advised me that being able to go is such a huge blessing that any discomfort or inconvenience along the way is worth it. Whatever hardship you experience is worth it, because being able to go for Umrah is such a big deal.”</p>"},
      {t:"p",h:"People have lined up outside the Apple store for hours to be the first to buy a new iPhone. People stood fourteen hours just to pass by the Queen and pay their respects. So when we are going for the sake of Allah and experience some inconvenience, whether hunger, thirst or waiting:"},
      {t:"chips",items:["Be careful what you <b>say</b>","Be careful what you <b>think</b>","Be careful how you <b>respond</b>"]},
      {t:"key",h:"You want to complete this journey with excellence, with iḥsān."},
      {t:"h",n:5,h:"It is an obligation"},
      {t:"p",h:"The ʿulamāʾ also say this ayah establishes the obligation of Hajj and of Umrah, since Allah tells us to do both for His sake. Just as Hajj is obligatory, a pillar of Islam, Umrah is also an act of worship that is obligatory on those who are able to perform it."}
    ]
  },
  {
    id:"c6", title:"Is Umrah Obligatory?", color:PAL.sky,
    summary:"What the Prophet ﷺ instructed, what the Companions held, and doing it for others.",
    blocks:[
      {t:"p",h:"The Prophet ﷺ instructed people:"},
      {t:"hd",ar:"أَقِيمُوا الصَّلَاةَ وَآتُوا الزَّكَاةَ وَحُجُّوا وَاعْتَمِرُوا",en:"Establish the prayer, give zakat, perform Hajj, and perform Umrah.",ref:"Hadith"},
      {t:"p",h:"When ʿĀʾishah رضي الله عنها asked whether women must perform jihad, the Prophet ﷺ said yes: upon them is a jihad in which there is no fighting, and that jihad is Hajj and Umrah."},
      {t:"h",h:"What the Companions said"},
      {t:"list",items:["<b>Ibn ʿAbbās</b> رضي الله عنهما: Hajj and Umrah are companions of one another in the Book of Allah; they are mentioned together.","<b>Ibn ʿUmar</b> رضي الله عنهما: Hajj and Umrah are obligatory on every Muslim.","<b>Jābir</b> رضي الله عنه said:"]},
      {t:"hd",kind:"Saying of a Companion",ar:"لَيْسَ مُسْلِمٌ إِلَّا عَلَيْهِ عُمْرَةٌ",en:"There is no Muslim except that upon him is the duty to perform Umrah."},
      {t:"h",h:"As soon as you are able"},
      {t:"p",h:"Hajj and Umrah are deeds a person should perform as soon as they can."},
      {t:"story",kind:"In the time of ʿUmar رضي الله عنه",h:"<p>A Christian Bedouin embraced Islam and came to some Muslims, who told him to do Hajj and Umrah before doing anything else. When he mentioned this to ʿUmar رضي الله عنه, ʿUmar confirmed it: yes, this is how it should be. The man went for his Hajj and Umrah and took his sacrificial animal along.</p><p>The view of the Companions was that even before jihad, you do Hajj and Umrah. It is that important.</p>"},
      {t:"p",h:"Ibn ʿUmar رضي الله عنهما also said that the Prophet ﷺ performed Umrah before performing Hajj."},
      {t:"h",h:"On behalf of someone else"},
      {t:"p",h:"Umrah can be performed on behalf of someone else, for example someone elderly, or someone with an illness from which they do not expect to recover, who has not been able to perform it."},
      {t:"hd",en:"A man came to the Prophet ﷺ and said his father was a very old man who was not able to perform Hajj and Umrah. The Prophet ﷺ told him: do Hajj and Umrah on behalf of your father."},
      {t:"p",h:"He did not only say to do Hajj on his father's behalf. He also said to do Umrah."},
      {t:"key",h:"Many people think Umrah is voluntary: if you do it, fine, and if you don't, fine. No. At least once in a person's lifetime, they must do it."},
      {t:"p",h:"Umrah is open all year round: you can perform it in any month. Hajj has to be performed in the months of Hajj."}
    ]
  },
  {
    id:"c7", title:"The Virtues of Umrah", color:PAL.lilac,
    summary:"Forgiveness, the removal of poverty, and being the guests of Allah.",
    blocks:[
      {t:"h",n:1,h:"It is in the way of Allah"},
      {t:"hd",ar:"إِنَّ الْحَجَّ وَالْعُمْرَةَ مِنْ سَبِيلِ اللَّهِ",en:"Indeed, Hajj and Umrah are from the way of Allah."},
      {t:"p",h:"<em>Sabīl Allāh</em> is the religion of Allah. It is also the path of Allah: the path that takes one to Allah's approval, the path He has legislated. In the Qur'an the word is sometimes also used for jihad, striving in the way of Allah."},
      {t:"p",h:"Hajj and Umrah require a lot of effort. You have to be physically fit, you have to endure, and you have to spend a great deal of money. These are extraordinary acts of worship."},
      {t:"h",n:2,h:"It expiates the sins in between"},
      {t:"hd",en:"From one Umrah to another is an expiation for the sins that came in between them."},
      {t:"p",h:"If a person performed Umrah ten years ago and performs Umrah again this year, then once they complete it, all the sins they committed in between will be forgiven. We don't even remember the sins we have committed. We do them and forget them, or we think they are not really a big deal."},
      {t:"key",h:"This is an encouragement to perform Umrah again and again. Don't think this is the one and only time. Intend to go again and again."},
      {t:"p",h:"Umrah is a visit. When you visit a loved one or a place you love, you don't go just once. You visit repeatedly, because you know there are many benefits."},
      {t:"h",n:3,h:"It removes poverty and sin"},
      {t:"hd",ar:"تَابِعُوا بَيْنَ الْحَجِّ وَالْعُمْرَةِ فَإِنَّ الْمُتَابَعَةَ بَيْنَهُمَا تَنْفِي الْفَقْرَ وَالذُّنُوبَ كَمَا يَنْفِي الْكِيرُ خَبَثَ الْحَدِيدِ",en:"Perform Hajj and Umrah one after the other, for following them one after the other removes poverty and sins just as the furnace removes impurity from iron."},
      {t:"p",h:"One Hajj is obligatory, but if you are able to go again, go again. The same with Umrah: if you are able to go again, you go."},
      {t:"story",kind:"The furnace",h:"<p>Something made of iron is not like glass that you wash with warm soapy water and it's shiny. The dirtier something is, the more rigorous the cleaning needs to be. Iron is purified by putting it in the furnace: in the heat, any impurity rises to the surface, and then you wipe it off.</p>"},
      {t:"p",h:"Some sins are like that. A person tries so hard to leave them, repents and feels bad, and after some time the desire returns. It is as if the sin is stuck to them."},
      {t:"p",h:"Poverty can be the same. A person tries to have a stable income, to save, to invest, to build a business, and cannot. As the family grows, expenses grow and rent goes up. Everyone complains, if not of poverty, then at least of shortage of money."},
      {t:"key",h:"The solution: go for Hajj and Umrah repeatedly, and Allah will remove these sins from you and remove poverty from you."},
      {t:"p",h:"The ʿulamāʾ explain this in two ways:"},
      {t:"list",items:["<b>Literally.</b> Sins are removed and poverty is erased, so the person is no longer poor. When you go for Umrah you are spending in the way of Allah, and when you spend in His way, Allah blesses your wealth and causes it to increase.","<b>Contentment.</b> The removal of poverty also means satisfaction of the heart. Some people cannot live comfortably on a six-figure salary, and others live with peace of mind and joy on much less. The difference is the state of the heart."]},
      {t:"p",h:"When you travel for Allah, you learn to live with much less. Your only focus is worship and your basic needs. This teaches you the reality of this world and its true worth, helps purify your heart, and helps you reorient yourself. So the removal of poverty means an increase in sustenance, and also the satisfaction that Allah bestows on a person."},
      {t:"h",n:4,h:"You are the guests of Allah"},
      {t:"hd",ar:"الْحُجَّاجُ وَالْعُمَّارُ وَفْدُ اللَّهِ إِنْ دَعَوْهُ أَجَابَهُمْ وَإِنِ اسْتَغْفَرُوهُ غَفَرَ لَهُمْ",en:"Those who perform Hajj and those who perform Umrah are the delegation of Allah. If they call upon Him, He answers them, and if they seek His forgiveness, He forgives them."},
      {t:"p",h:"If a guest in your house asks you for something, will you refuse? No. Part of honouring a guest is granting what they ask for. "+ari("وَلِلَّهِ الْمَثَلُ الْأَعْلَىٰ")+", and to Allah belongs the highest example: He honours those who come to visit His House, and He responds to their du'as."},
      {t:"cta",title:"Start your list from now",h:"List the things that are heavy on your heart: what causes you stress and worry, what pushes you into unhealthy habits, what makes you anxious, irritable, short-tempered or on edge. Whether it is your own struggle or your family's or your loved ones', write it down, and when you go, beg Allah and ask Him for a lot. There is no limit to how much you can ask Allah."},
      {t:"h",n:5,h:"You are in Allah's protection"},
      {t:"p",h:"Those who go for Umrah are in the protection of Allah, as we learn in the hadith. Allah honours them so much that they are given special protection."},
      {t:"h",n:6,h:"The jihad of those who cannot fight"},
      {t:"hd",en:"The jihad of the elderly, the young, the weak and the women is Hajj and Umrah."},
      {t:"h",n:7,h:"Reward in proportion to the effort"},
      {t:"hd",en:"The Prophet ﷺ said to ʿĀʾishah رضي الله عنها that the reward of her Umrah would be in proportion to the hardship she endured and the wealth she spent."},
      {t:"p",h:"You may not have gone yet, and already you are enduring some hardship for it: working overtime, or wrapping up certain projects quickly so that you are able to travel."},
      {t:"p",h:"The hardship can come in the form of travel, hunger, physical exertion or fatigue. Then in the Umrah itself you do ṭawāf and saʿī in the state of iḥrām; you probably have not slept well, your feet hurt, your legs hurt, maybe the weather doesn't suit you."},
      {t:"key",h:"There is hardship one has to endure, but your reward is in proportion to how much hardship you endure and how much you spend."},
      {t:"h",n:8,h:"If you die on the way"},
      {t:"hd",en:"When a person intends to go for Umrah and dies on the journey, not able to complete the Umrah or make it back home, the reward of Umrah is written for them until the Day of Judgement."}
    ]
  },
  {
    id:"c8", title:"Umrah in Ramadan", color:PAL.peach,
    summary:"The reward of Hajj with the Prophet ﷺ, and the story of Umm Ṭalīq.",
    blocks:[
      {t:"p",h:"Depending on when a person performs it, the reward of Umrah can be even more."},
      {t:"hd",en:"When a person performs Umrah in the month of Ramadan, the reward is equal to performing Hajj with the Prophet ﷺ."},
      {t:"story",kind:"Abū Ṭalīq and Umm Ṭalīq رضي الله عنهما",h:"<p>Umm Ṭalīq came to her husband Abū Ṭalīq and said: let's go for Hajj together. He had two camels: a she-camel he went for Hajj on, and a male camel he had kept for jihad fī sabīlillāh.</p><p>She asked to borrow the male camel. He said: you know I use it for jihad, how can I lend it to you? She said: Hajj is also fī sabīlillāh, may Allah have mercy on you, please lend it to me. He refused.</p><p>She said: then give me the she-camel, and you take the other. He said: I am not going to give you preference over myself. She asked for some money to find a ride, saying Allah would give him something even better. He said he did not have that much, and refused.</p><p>So she said: when you go to the Prophet ﷺ, give him my salām and tell him what I asked you for and what you said.</p><p>When he did, the Prophet ﷺ said Umm Ṭalīq was right. Had he given her the camel kept for jihad, it would still be in the way of Allah, because going for Hajj and Umrah is in the way of Allah. Had he given her the she-camel, both of them would be in the way of Allah. And had he given her some of his wealth, Allah would have given him something even better.</p><p>Then he said: O Messenger of Allah, she was also asking what action equals the reward of Hajj with you. The Prophet ﷺ replied: performing Umrah in the month of Ramadan.</p>"},
      {t:"h",h:"Lessons from the hadith"},
      {t:"list",items:["Men should be generous with their wives.","Men should support their wives in worshipping Allah, and when they do, Allah ﷻ blesses them in their wealth.","Umrah in Ramadan brings the reward of doing Hajj with the Prophet ﷺ."]},
      {t:"p",h:"The Prophet ﷺ also said to a man from the Anṣār and his wife:"},
      {t:"hd",ar:"اعْتَمِرَا فِي رَمَضَانَ",en:"Both of you, perform Umrah in Ramadan, for Umrah in Ramadan is equal to the reward of Hajj."}
    ]
  },
  {
    id:"c9", title:"Who Must Perform Umrah", color:PAL.aqua,
    summary:"The conditions that make Umrah obligatory, and two more for women.",
    blocks:[
      {t:"p",h:"There are certain conditions, prerequisites you could say. Umrah is obligatory on a person who is:"},
      {t:"all",items:[["Muslim","The first condition"],["Sane","Of sound mind"],["An adult","Has reached adulthood"],["Free","It is not an obligation on a slave"],["Able","Physical health and financial capacity"]]},
      {t:"h",h:"For women: a maḥram"},
      {t:"p",h:"For women there is an additional condition: she should have her maḥram with her."},
      {t:"hd",en:"It is not permissible for a man to be alone with a woman who is not related to him, and no woman should travel except with a maḥram. A man stood up and said: O Messenger of Allah, I have intended to go for such-and-such jihad, and my wife is going for Hajj. The Prophet ﷺ said: go and perform Hajj with your wife.",ref:"Ṣaḥīḥ al-Bukhārī"},
      {t:"p",h:"He did not say: let your wife go alone. He said: go with her, because she should not go on her own."},
      {t:"h",h:"For women: not in ʿiddah"},
      {t:"p",h:"A woman should not be in her ʿiddah, her state of <em>ḥidād</em>. If a woman's husband has passed away and she is observing the mourning period of four months and ten days, she should not go during it."},
      {t:"story",kind:"In the time of ʿUmar رضي الله عنه",h:"<p>When women in ḥidād came for Umrah, ʿUmar would turn them back from Dhul-Ḥulayfah, the place where people make the intention. He would send them back: you cannot do it right now, you are in your ʿiddah.</p>"}
    ]
  },
  {
    id:"c10", title:"Why We Go: Four Objectives", color:PAL.blush,
    summary:"Sincerity, taqwā, remembrance of Allah, and purifying the nafs. Set these goals now.",
    blocks:[
      {t:"p",h:"What are the objectives of Umrah? Why are we performing it? It is important to set these goals now, in shāʾ Allāh."},
      {t:"h",n:1,h:"Purely for Allah"},
      {t:"p",h:"We want to please Allah ʿazza wa jall and establish tawḥīd in our lives, doing something purely for His sake alone. Umrah is an act of worship dedicated to Allah alone."},
      {t:"q",ar:"وَمَا أُمِرُوا إِلَّا لِيَعْبُدُوا اللَّهَ مُخْلِصِينَ لَهُ الدِّينَ",en:"And they were not commanded except to worship Allah, being sincere to Him in religion.",ref:"Sūrat al-Bayyinah 98:5"},
      {t:"p",h:"All acts of worship we dedicate to Allah should be sincerely for His sake alone."},
      {t:"h",n:2,h:"To develop taqwā"},
      {t:"p",h:"Allah mentions Hajj and Umrah in several places in the Qur'an, and in these verses taqwā is mentioned many times."},
      {t:"p",h:"Taqwā is a state of heightened consciousness of Allah. Because a person is so conscious of Him, they don't want to do anything that would anger or displease Him, so they stay away from disobedience, big and small. They become very careful. And they want to make Allah happy with them, so they are eager to do every deed that pleases Him, the big things and the little things."},
      {t:"q",ar:"وَاتَّقُوا اللَّهَ وَاعْلَمُوا أَنَّ اللَّهَ شَدِيدُ الْعِقَابِ",en:"And have taqwā of Allah, and know that Allah is severe in penalty.",ref:"Sūrat al-Baqarah 2:196"},
      {t:"q",ar:"وَتَزَوَّدُوا فَإِنَّ خَيْرَ الزَّادِ التَّقْوَىٰ",en:"And take provisions, but the best provision is taqwā.",ref:"Sūrat al-Baqarah 2:197"},
      {t:"key",h:"We want to do Umrah so that we increase in our taqwā."},
      {t:"h",n:3,h:"To remember Allah"},
      {t:"hd",en:"Ṭawāf of the Kaʿbah, going between Ṣafā and Marwah, and at Hajj the stoning of the pillars: all of these rituals have been established for the remembrance of Allah."},
      {t:"p",h:"You remember Allah with your tongue, and you remember Him with your actions. When you are doing ṭawāf, your tongue is busy in His remembrance. You want to develop the habit of remembering Allah."},
      {t:"h",n:4,h:"To purify the nafs"},
      {t:"p",h:"When a person enters the state of iḥrām, they put aside their personal preferences and desires and make obedience to Allah their ultimate goal. Even if you want to cut your nails, you won't. Even if you want to use perfume, which people like, you won't. Men who want to wear comfortable clothes cannot."},
      {t:"q",ar:"فَمَن فَرَضَ فِيهِنَّ الْحَجَّ فَلَا رَفَثَ وَلَا فُسُوقَ وَلَا جِدَالَ فِي الْحَجِّ",en:"Whoever has made Hajj obligatory upon himself therein, there is to be no sexual relations, no disobedience and no disputing during Hajj.",ref:"Sūrat al-Baqarah 2:197"},
      {t:"p",h:"There are rules a person has to observe in the state of iḥrām. These are covered in detail in Part Two."}
    ]
  },
  {
    id:"c11", title:"Start Preparing Now", color:PAL.sand,
    summary:"Mental and physical preparation, and packing wisely.",
    blocks:[
      {t:"h",h:"Mental preparation begins now"},
      {t:"p",h:"From now, remind yourself: I'm doing this for the sake of Allah. I'm going for the sake of Allah. Repeat the ayah:"},
      {t:"q",ar:"وَأَتِمُّوا الْحَجَّ وَالْعُمْرَةَ لِلَّهِ",en:"And complete the Hajj and Umrah for Allah.",ref:"Sūrat al-Baqarah 2:196"},
      {t:"p",h:"If family are going with you, remind them too: we are doing this for Allah, we want to please Allah. Allah only accepts deeds done sincerely for His sake."},
      {t:"dua",kind:"ʿUmar's du'a for sincerity",ar:"اللَّهُمَّ اجْعَلْ عَمَلِي كُلَّهُ صَالِحًا وَاجْعَلْهُ لِوَجْهِكَ خَالِصًا وَلَا تَجْعَلْ لِأَحَدٍ فِيهِ شَيْئًا",en:"O Allah, make all of my actions righteous, make them sincerely for Your Face alone, and do not give anyone else a share in them."},
      {t:"dua",kind:"The Prophet's ﷺ words at his Hajj",ar:"اللَّهُمَّ حَجَّةٌ لَا رِيَاءَ فِيهَا وَلَا سُمْعَةَ",en:"O Allah, a Hajj in which there is no showing off and no seeking of reputation."},
      {t:"p",h:"Meaning: I am doing this purely for You, not to show off to people, nor to earn a reputation of being a Ḥājjah or Ḥājjī."},
      {t:"p",h:"Part of the preparation is learning the rituals and steps of Umrah, as the Prophet ﷺ said:"},
      {t:"hd",ar:"لِتَأْخُذْ أُمَّتِي مَنَاسِكَهَا",en:"Let my Ummah learn its rituals."},
      {t:"h",h:"Physical preparation"},
      {t:"p",h:"Umrah requires a lot of walking. Someone recently told the teacher they were averaging <b>10,000 steps a day</b> during their Umrah. So start walking now to build that capacity. Otherwise you will miss praying in al-Masjid al-Ḥarām, where one salah is <b>100,000 times</b> more rewarding than salah anywhere else."},
      {t:"h",h:"Take your provisions"},
      {t:"story",kind:"The people of Yemen",h:"<p>The people of Yemen used to go for Hajj without bringing any supplies, saying: we put our trust in Allah. But in Makkah they had needs, and they would ask people to give them something. Basically, they would beg. So Allah revealed:</p>"},
      {t:"q",ar:"وَتَزَوَّدُوا فَإِنَّ خَيْرَ الزَّادِ التَّقْوَىٰ",en:"And take provisions, but the best provision is taqwā.",ref:"Sūrat al-Baqarah 2:197"},
      {t:"p",h:"Taking provisions doesn't mean taking your entire wardrobe, many pairs of shoes and a lot of food. Pack, but pack wisely, so you don't struggle to manage it all there. Talk to people about which clothing, shoes, slippers and bag are best."},
      {t:"pack"},
      {t:"key",h:"Don't forget simplicity, because simplicity is from faith."},
      {t:"p",h:"This is not a journey for taking photos all the time. Focus on the moment, and enjoy the moments there by immersing yourself in the remembrance and worship of Allah."},
      {t:"hd",kind:"Narration",en:"The Prophet ﷺ performed Hajj on an old saddle, wearing a cloak worth four dirhams or less."},
      {t:"p",h:"You don't have to buy everything new. Unbranded things are fine, as long as they are comfortable and useful, so your ʿibādah is easy. Prefer comfort over looks."},
      {t:"key",h:"Begin preparing now, because when you begin preparing, that is when your reward begins too, in shāʾ Allāh."},
      {t:"dua",kind:"Each session closes with",ar:"سُبْحَانَكَ اللَّهُمَّ وَبِحَمْدِكَ أَشْهَدُ أَنْ لَا إِلَٰهَ إِلَّا أَنْتَ أَسْتَغْفِرُكَ وَأَتُوبُ إِلَيْكَ",en:"Glory be to You, O Allah, and praise. I bear witness that there is no god but You. I seek Your forgiveness and turn to You in repentance."}
    ]
  }
  ]
},
{
  id:"p2", num:"Part Two", title:"The Pillars and Iḥrām", session:"Session 2",
  chapters:[
  {
    id:"s2c1", title:"Pillars and Obligations", color:PAL.rose,
    summary:"The three arkān of Umrah and its two wājibāt.",
    blocks:[
      {t:"p",h:"After the first session on what Umrah is and why we do it, I hope you have started preparing for this journey, mentally, spiritually and physically. To take advantage of it, we really need to prepare in advance."},
      {t:"h",h:"The arkān: three pillars"},
      {t:"p",h:"The arkān are the rituals of Umrah that are necessary to perform. If a person misses any one of them, their Umrah is incomplete; it does not count. It is like salah: if a person does not recite al-Fātiḥah or does not make sajdah at all, the salah is not valid."},
      {t:"all",items:[["1 · Iḥrām","The intention to begin the rituals"],["2 · Ṭawāf","Around the Kaʿbah"],["3 · Saʿī","Between Ṣafā and Marwah"]]},
      {t:"h",n:1,h:"Iḥrām"},
      {t:"p",h:"Iḥrām is having the intention to perform the rituals of Umrah or Hajj. It is not merely certain clothing: it is the intention of the heart. The Prophet ﷺ said:"},
      {t:"hd",ar:"إِنَّمَا الْأَعْمَالُ بِالنِّيَّاتِ",en:"Actions are only by intentions."},
      {t:"p",h:"Before the action, the intention must be there. The intention of Umrah begins with the iḥrām."},
      {t:"h",n:2,h:"Ṭawāf"},
      {t:"p",h:"Ṭawāf is the first act of worship to perform on entering al-Masjid al-Ḥarām. If a person does not perform it, their Umrah does not count."},
      {t:"q",ar:"وَلْيَطَّوَّفُوا بِالْبَيْتِ الْعَتِيقِ",en:"And let them perform ṭawāf of the Ancient House.",ref:"Sūrat al-Ḥajj 22:29"},
      {t:"p",h:"When the Prophet ﷺ entered Makkah and the masjid, he went straight to the Black Stone, did <em>istilām</em>, and began the ṭawāf right away."},
      {t:"h",n:3,h:"Saʿī"},
      {t:"hd",ar:"اسْعَوْا فَإِنَّ اللَّهَ كَتَبَ عَلَيْكُمُ السَّعْيَ",en:"Perform saʿī, for Allah has prescribed saʿī for you."},
      {t:"h",h:"The wājibāt: two obligations"},
      {t:"p",h:"The wājibāt are obligatory parts of Umrah. If for some reason a person is not able to perform them, their Umrah still counts, but they have to give the <em>fidyah</em>."},
      {t:"all",items:[["1 · Iḥrām at the mīqāt","Entering iḥrām at the appointed place"],["2 · Shaving or trimming","Men shave or trim; women trim"]]}
    ]
  },
  {
    id:"s2c3", title:"The Mīqāt", color:PAL.sky,
    summary:"The appointed places you must not pass without iḥrām.",
    blocks:[
      {t:"p",h:"<em>Mīqāt</em> means the specified time for doing something: when you reach a certain time, or a certain place, it is time to perform the required action."},
      {t:"p",h:"For Umrah and Hajj there are "+ari("مَوَاقِيتُ مَكَانِيَّةٌ")+", appointed places. When a person on the way to Makkah reaches one, they must enter the state of iḥrām. They must not pass that point without it. Different mawāqīt have been appointed depending on which side people come from."},
      {t:"hd",en:"The people of Madinah should assume iḥrām from Dhul-Ḥulayfah, the people of Shām from al-Juḥfah, and the people of Najd from Qarn. And in another version: the people of Yemen from Yalamlam.",ref:"Ṣaḥīḥ al-Bukhārī"},
      {t:"all",items:[["Dhul-Ḥulayfah","For Madinah, north of Makkah"],["Al-Juḥfah","For Shām"],["Qarn","For Najd"],["Yalamlam","For Yemen"]]},
      {t:"h",h:"In practice"},
      {t:"list",items:["<b>By plane:</b> an announcement is usually made a few minutes before passing the mīqāt. That is when you make sure you are in your iḥrām and enter the state of iḥrām.","<b>By road from Madinah:</b> it is very easy. People typically stop at the masjid at Dhul-Ḥulayfah and put on iḥrām there."]},
      {t:"key",h:"Entering iḥrām at the mīqāt is wājib. If for some reason it is not done, the fidyah has to be given."},
      {t:"h",h:"Where and when to put it on"},
      {t:"list",items:["It is best to put on the iḥrām on reaching the mīqāt.","If you feel you won't be able to change on the plane, it is better to put it on at the airport. That is allowed, though the mīqāt is better.","Don't think it is better to put it on at Masjid an-Nabawī or some other masjid. Follow the Prophet ﷺ: wear iḥrām where he wore it, or where he told people to wear it."]}
    ]
  },
  {
    id:"s2c4", title:"Shaving and Trimming", color:PAL.sage,
    summary:"The second wājib, and the Prophet's ﷺ du'a for those who shave.",
    blocks:[
      {t:"p",h:"The second wājib is trimming the hair for women, and shaving the head or trimming the hair for men. It is mentioned in the Qur'an: you will enter al-Masjid al-Ḥarām, if Allah wills, in security,"},
      {t:"q",ar:"مُحَلِّقِينَ رُءُوسَكُمْ وَمُقَصِّرِينَ",en:"with your heads shaved and your hair trimmed.",ref:"Sūrat al-Fatḥ 48:27"},
      {t:"hd",ar:"اللَّهُمَّ اغْفِرْ لِلْمُحَلِّقِينَ",en:"The Prophet ﷺ said: “O Allah, forgive those who shave their heads.” The people said: “And those who trim?” He repeated: “O Allah, forgive those who shave.” This happened three times, and then he said: “And those who trim.”"},
      {t:"p",h:"The Prophet ﷺ made du'a three times for the men who shave their heads and once for those who trim."},
      {t:"key",h:"For men, shaving is better than trimming. For women, it is only trimming."}
    ]
  },
  {
    id:"s2c5", title:"What Iḥrām Means", color:PAL.butter,
    summary:"Entering a sacred state in which some lawful things become forbidden.",
    blocks:[
      {t:"h",h:"In the language"},
      {t:"p",h:"Linguistically, iḥrām means to enter a sacred state, a state of sanctity. "+ari("أَحْرَمَ الرَّجُلُ")+" is said when a person enters a state or time in which what was previously lawful for him becomes forbidden."},
      {t:"p",h:"For example, the word was used for a person who made a contract or a promise: once they entered the state of fulfilling its terms, what was previously allowed for them was no longer allowed."},
      {t:"h",h:"In the dīn"},
      {t:"p",h:"When you begin Umrah or Hajj, you enter the state of iḥrām, in which certain things that were allowed for you are no longer allowed."},
      {t:"all",items:[["Nails","Allowed before; not trimmed in iḥrām"],["Perfume","Allowed before; not worn in iḥrām"],["Trousers","Men wear them normally; not in iḥrām"]]},
      {t:"p",h:"Figuratively, the word iḥrām is also used for the two sheets men wear. But iḥrām is not just the clothing. Iḥrām is the intention, and the state in which certain things are forbidden."}
    ]
  },
  {
    id:"s2c6", title:"Iḥrām for Men", color:PAL.aqua,
    summary:"The two sheets, the sandals, what is not worn, and the exceptions.",
    blocks:[
      {t:"p",h:"For men the iḥrām is well known: two white sheets, the <em>izār</em> as a waist wrapper and the <em>ridāʾ</em> to cover the upper body."},
      {t:"hd",en:"One of you should wear iḥrām in his izār, his ridāʾ and sandals (naʿlayn). Whoever does not find sandals should wear leather socks, cut from the top so they are below the ankles."},
      {t:"p",h:"So iḥrām affects not only what a man wears, but also his footwear: the ankles should not be covered."},
      {t:"h",h:"What men do not wear"},
      {t:"hd",en:"A man asked the Prophet ﷺ what a muḥrim should wear. He replied: he should not wear a shirt, a turban, trousers, a hooded cloak, or a garment scented with saffron or wars. If he has no sandals, he may wear leather socks cut short so the ankles are bare."},
      {t:"list",items:["<b>No stitched clothing.</b> This does not mean clothing with thread in it, but clothing cut and tailored to fit: a shirt, a jacket, trousers.","<b>Nothing covering the head,</b> such as a turban or a hat.","<b>No socks</b> that go up over the ankles, like cotton socks."]},
      {t:"story",kind:"Arriving at night",h:"<p>A man passes the mīqāt and reaches Makkah at night, or right at Jumuʿah time, and cannot perform Umrah right away. He needs to sleep. Can he change into his pyjamas and T-shirt? No. He is still in the state of iḥrām.</p>"},
      {t:"h",h:"Wrapping is not wearing"},
      {t:"p",h:"If it is cold or raining, or the air conditioning on the plane is very cold, a man may put a sweater or jacket over himself without putting his arms in the sleeves. He can wrap it, but he cannot wear it. Men are not forbidden from touching shirts or jackets; they are forbidden from wearing them."},
      {t:"h",h:"If he has no izār"},
      {t:"hd",en:"Whoever does not find an izār should wear trousers, and whoever does not find sandals should wear leather socks.",ref:"Ṣaḥīḥ al-Bukhārī"},
      {t:"story",kind:"Forgot the iḥrām on the plane",h:"<p>A man thinks he packed his iḥrām in his backpack, but on the plane finds only one sheet. Or he loses the bag, or checks in all his luggage by accident. He cannot pass the mīqāt without iḥrām.</p><p>Shaykh Ibn ʿUthaymīn was asked about exactly this. He said the man should take off his head covering, remove his shirt and wrap it around his upper body, and keep his trousers on since he has no izār. There is no fidyah, because the Prophet ﷺ said whoever does not find an izār should wear trousers.</p>"},
      {t:"key",h:"Hajj and Umrah are not only for the rich. In exceptional situations our dīn grants exceptions and conveniences."},
      {t:"p",h:"Some men get chafing on their thighs from walking without trousers, and there is a lot of walking in ṭawāf and saʿī. For this, or eczema or another skin condition, the ʿulamāʾ have permitted wearing something like small shorts under the izār to protect the skin. In a situation like this, consult someone of knowledge. No fidyah is required, and the iḥrām is valid."},
      {t:"h",h:"Changing the sheets"},
      {t:"p",h:"A man may change his iḥrām as long as he wears iḥrām again. If his upper sheet gets dirty, he can put on another white sheet. He cannot put on a T-shirt."}
    ]
  },
  {
    id:"s2c7", title:"Iḥrām for Women", color:PAL.blush,
    summary:"Your regular clothing with proper hijab, and no gloves or niqāb.",
    blocks:[
      {t:"p",h:"For a woman there is no specific clothing required as iḥrām. She can wear any clothing she generally wears, while observing proper hijab and remaining within the limits Allah has set for women's clothing."},
      {t:"key",h:"Some women think they should wear white in iḥrām. This is not required, and it is not more virtuous either."},
      {t:"list",items:["Not too thin, as in see-through.","Not too tight.","Not too short."]},
      {t:"hd",kind:"Narration of ʿĀʾishah رضي الله عنها",en:"When asked what a woman should wear in iḥrām, she said: she can wear her silk and woollen clothes, her linen and cotton clothes, her coloured clothes, and her jewellery."},
      {t:"p",h:"ʿĀʾishah رضي الله عنها herself wore red clothes dyed with safflower in iḥrām (her clothes, not her hijab), and she saw no harm in a woman wearing jewellery, black or pink clothing, or leather socks. The material, colour, and how fancy it is do not matter; what matters is proper hijab."},
      {t:"h",h:"Changing clothes"},
      {t:"story",kind:"Example",h:"<p>A woman made her intention on the plane, began the talbiyah, reached the Ḥaram and did her ṭawāf. Then her baby throws up on her, and her clothes are dirty and smell. She goes and changes, then does her saʿī. Is that permissible? Absolutely.</p>"},
      {t:"h",h:"No gloves, no niqāb"},
      {t:"hd",en:"The Prophet ﷺ forbade women in iḥrām from wearing gloves, the niqāb, and clothing touched by wars or saffron."},
      {t:"p",h:"Clothing with fragrance on it is not permissible for women in iḥrām."},
      {t:"h",h:"Covering the face is different from wearing a niqāb"},
      {t:"p",h:"A niqāb is a garment made to fit the face in order to cover it, just as trousers are made to fit the legs and a shirt the upper body. Men in iḥrām don't wear trousers and shirts, but they are not left uncovered; they wear two sheets. In the same way, a woman who usually covers her face will not wear a garment made to fit the face: a niqāb tucked at the sides of the face, or one stitched with elastic behind it."},
      {t:"hd",kind:"Narration",en:"Fāṭimah bint al-Mundhir said: we used to veil our faces while in iḥrām, in the company of Asmāʾ bint Abī Bakr رضي الله عنها."},
      {t:"p",h:"Since Asmāʾ approved of this, it is correct, and other narrations say the same. So when needed, for example when men pass by, a woman lets part of her head covering or hijab come down over her face."},
      {t:"p",h:"She will not wear gloves either. If she feels the need, she can use her sleeves to cover her wrists and hands."}
    ]
  },
  {
    id:"s2c8", title:"Before Entering Iḥrām", color:PAL.mint,
    summary:"Cleanliness, ghusl, perfume, and when to put on iḥrām.",
    blocks:[
      {t:"h",h:"Clean your body before you leave"},
      {t:"p",h:"Before leaving the house for the airport and the journey:"},
      {t:"list",items:["Take a shower.","Make sure your nails are trimmed.","Men should trim their moustache.","Remove any body hair that is to be removed.","Take ghusl."]},
      {t:"hd",kind:"Narration",en:"Ibn ʿUmar رضي الله عنهما said: it is from the sunnah that the person who intends to wear iḥrām first makes ghusl."},
      {t:"p",h:"The Prophet ﷺ made ghusl before entering iḥrām, and the Companions followed him in that. Even a menstruating woman takes ghusl and then enters iḥrām:"},
      {t:"hd",en:"A menstruating woman and one who has delivered a child should take a bath, put on iḥrām, and perform all the rites except the ṭawāf."},
      {t:"p",h:"If this is for the woman who is menstruating, then men and other women should certainly bathe before iḥrām. Since you cannot bathe on the plane, shower before you leave the house."},
      {t:"h",h:"Perfume: men"},
      {t:"hd",kind:"Narration of ʿĀʾishah رضي الله عنها",en:"When the Prophet ﷺ wanted to enter iḥrām, he would perfume himself with the best perfume he could find, and I would then see the shining traces of musk on his head and beard. In another narration: on the parting of his hair."},
      {t:"p",h:"So men apply perfume to the body, the skin and even the hair, but not to the iḥrām clothes. No ʿiṭr, bakhūr or perfume spray on the white sheets. Before iḥrām, a man's perfume on his skin can even be strong."},
      {t:"h",h:"Perfume: women"},
      {t:"p",h:"Women should not wear clothes with perfume on them, nor apply perfume that spreads before entering iḥrām."},
      {t:"hd",ar:"أَلَا وَطِيبُ النِّسَاءِ لَوْنٌ لَا رِيحَ لَهُ",en:"Indeed, the perfume of women is that which has colour and no scent that spreads."},
      {t:"p",h:"<em>Rīḥ</em> is wind: the fragrance should not spread in the air around her."},
      {t:"hd",kind:"Narration of ʿĀʾishah رضي الله عنها",en:"We were going to Makkah with the Prophet ﷺ, and at the time of putting on iḥrām we pasted on our foreheads the perfume known as sukk. When one of us sweated, it would run down her face. The Prophet ﷺ saw it and did not forbid it."},
      {t:"p",h:"Sukk is a very light perfume that doesn't spread. So, for example, if a woman wears a deodorant with a light fragrance before iḥrām, that is okay, as long as the fragrance does not spread. If it is strong and spreads, it is not permissible. If it gets on the clothes, of a man or a woman, it should be washed off."},
      {t:"h",h:"When to put it on"},
      {t:"p",h:"If possible, put on iḥrām after an obligatory prayer: for example, pray ẓuhr and put on iḥrām right after it."},
      {t:"key",h:"There is no nafl prayer required for iḥrām. Some people think that once they put on the clothes, make the intention and start the talbiyah, they must pray two rakʿahs. That is not required."}
    ]
  },
  {
    id:"s2c9", title:"What Is Allowed in Iḥrām", color:PAL.sage,
    summary:"Bathing, combing, oils, watches, belts, treatment, and more.",
    blocks:[
      {t:"p",h:"When you learn that there are rules about what you can wear and do, you want to be clear about what is actually allowed in the state of iḥrām. For men and women:"},
      {t:"yn",items:[
        [1,"Taking a bath or shower, and washing the head."],
        [1,"Washing the iḥrām garments, or changing them for something still appropriate in iḥrām."],
        [1,"For women: undoing the hair, combing and brushing it."],
        [1,"Scratching the head or the skin."],
        [1,"Looking at oneself in the mirror."],
        [1,"Applying oil or cream to the body."],
        [1,"Smelling a good fragrance. Applying perfume is not allowed, but smelling it is."],
        [1,"Eating food that is very fragrant or has saffron in it."],
        [1,"Wearing jewellery, glasses, a watch, a money belt or a bag."],
        [1,"A belt to hold the izār in place. The belt doesn't stitch the izār, and an izār with a belt does not become trousers."],
        [1,"Kuḥl in the eyes when there is a need."],
        [1,"Urgent treatment, such as cupping or bandages."],
        [1,"Killing a harmful creature, like a scorpion or a mouse."]
      ]},
      {t:"p",h:"Women should be careful that jewellery does not become a distraction, nor a way of showing adornment (<em>tabarruj</em>). That is not appropriate."},
      {t:"hd",en:"A man had a complaint in his eyes while in the state of iḥrām, and he was allowed to use kuḥl."},
      {t:"hd",en:"The Prophet ﷺ had cupping done while he was in the state of iḥrām.",ref:"Ṣaḥīḥ al-Bukhārī"},
      {t:"p",h:"Hunting is not permissible. A harmful, dangerous creature may be killed, but you don't have to kill every ant you see. If it isn't bothering you, you can easily move away."}
    ]
  },
  {
    id:"s2c10", title:"What Is Forbidden in Iḥrām", color:PAL.rose,
    summary:"Clothing, nails and hair, perfume, covering the head, intimacy, hunting and marriage.",
    blocks:[
      {t:"yn",items:[
        [0,"Wearing clothing other than what fits the restrictions of iḥrām that the Prophet ﷺ detailed."],
        [0,"Trimming the nails, or trimming any hair on the body."],
        [0,"Applying perfume, or wearing clothing that has perfume on it."],
        [0,"For men: covering the head with a turban, hat or scarf."],
        [0,"Any intimacy between husband and wife."],
        [0,"Hunting."],
        [0,"Getting married, being given in marriage, or proposing."]
      ]},
      {t:"h",h:"Perfume after entering iḥrām"},
      {t:"p",h:"Once a person enters iḥrām, they can no longer apply perfume, on the skin or on the body."},
      {t:"story",kind:"Example",h:"<p>A woman wants to change into a fresh hijab, but it was packed next to a bottle of oud and now smells of oud. Can she wear it? No. Or the fabric softener had a lovely lavender or linen fragrance and the hijab smells of it. Can she wear it? No.</p>"},
      {t:"h",h:"Soap and toothpaste"},
      {t:"p",h:"Soap and toothpaste have fragrance in them. You can take fragrance-free soap, but you may not always have it. Are you not going to wash your hands with soap? Of course you are. The ʿulamāʾ say there is nothing wrong with it, because the purpose is to clean yourself, not to apply fragrance. This doesn't mean using strongly scented soap on purpose. Only do it when you have no other option."},
      {t:"h",h:"Covering the head vs shade"},
      {t:"p",h:"A man may not wear anything on his head, but he may use an umbrella, go under something that gives shade, or sit in a car. What is wrong is wearing something on the head."},
      {t:"h",h:"Husband and wife"},
      {t:"q",ar:"فَلَا رَفَثَ وَلَا فُسُوقَ وَلَا جِدَالَ فِي الْحَجِّ",en:"There is to be no sexual relations, no disobedience and no disputing during Hajj.",ref:"Sūrat al-Baqarah 2:197"},
      {t:"p",h:"So they will not cuddle, and will not romantically hold hands while walking in ṭawāf. This doesn't mean a husband cannot touch his wife or a wife her husband; that is permissible."},
      {t:"h",h:"Marriage"},
      {t:"hd",en:"A person in the state of iḥrām may not marry, be given in marriage, or ask for someone's hand in marriage.",ref:"Ṣaḥīḥ Muslim"},
      {t:"p",h:"In iḥrām the focus is ʿibādah, not marriage, and not finding someone to propose to. If they see someone and are interested, they have to wait until afterwards."}
    ]
  },
  {
    id:"s2c11", title:"Mistakes and Illness", color:PAL.peach,
    summary:"What to do if you slip up, and the conditional iḥrām if you're unwell.",
    blocks:[
      {t:"h",h:"If you do something by mistake"},
      {t:"p",h:"Say you have a habit of applying perfume every morning as you get ready, and out of habit you apply it. You fix it: wash the perfume off your body, wash it off your clothes, or change if possible. If it happens out of ignorance, no fidyah is required."},
      {t:"h",h:"If you fear you can't complete it"},
      {t:"p",h:"A person falls ill a day before travelling, with a fever, and decides to go anyway. By the time they reach the mīqāt they are really unwell and don't know if they will manage the Umrah."},
      {t:"p",h:"They can enter iḥrām with a conditional clause: “O Allah, I intend to perform Umrah and to complete it, and I will stop wherever You stop me.”"},
      {t:"hd",en:"A woman at the time of the Prophet ﷺ wanted to go for Hajj, but she was sick. The Prophet ﷺ told her to say: O Allah, I will end my iḥrām at any place where You stop me."},
      {t:"key",h:"With this condition, a person can stop wherever they have to and come out of iḥrām, and they are not doing anything sinful."},
      {t:"h",h:"No iḥrām clothes at the mīqāt"},
      {t:"p",h:"You cannot cross the mīqāt without iḥrām. If a man doesn't have his iḥrām clothes, he makes the intention and does what he can: removes his hat, wears his shirt as a shawl, keeps his trousers on, and continues in iḥrām."}
    ]
  },
  {
    id:"s2c2", title:"The Talbiyah", color:PAL.lilac,
    summary:"What to say, why everything around you joins in, and how loudly.",
    blocks:[
      {t:"p",h:"Once a person enters iḥrām, they say the talbiyah. First, the intention for Umrah:"},
      {t:"dua",kind:"Intention for Umrah",ar:"لَبَّيْكَ عُمْرَةً",en:"Here I am, O Allah, for Umrah."},
      {t:"p",h:"Then they begin the talbiyah:"},
      {t:"dua",kind:"The Talbiyah",ar:"لَبَّيْكَ اللَّهُمَّ لَبَّيْكَ لَبَّيْكَ لَا شَرِيكَ لَكَ لَبَّيْكَ إِنَّ الْحَمْدَ وَالنِّعْمَةَ لَكَ وَالْمُلْكَ لَا شَرِيكَ لَكَ",en:"Here I am, O Allah, here I am. Here I am, You have no partner, here I am. Verily all praise and blessings are Yours, and all sovereignty. You have no partner."},
      {t:"p",h:"In another version, the Prophet ﷺ would say:"},
      {t:"dua",kind:"Also from the Prophet ﷺ",ar:"لَبَّيْكَ إِلَٰهَ الْحَقِّ لَبَّيْكَ",en:"Here I am, O God of truth, here I am."},
      {t:"h",h:"Don't miss it"},
      {t:"p",h:"Some people just don't say these words in iḥrām when doing Umrah. This is such a huge loss."},
      {t:"hd",en:"There is no pilgrim who recites the talbiyah except that whatever is to his right and left recites it too: the rocks, the trees and the hills, to the farthest ends of the earth in each direction."},
      {t:"p",h:"Can you imagine? Everything is joining you, which means so much more reward."},
      {t:"hd",en:"There is no person who says the talbiyah except that he is given good news. It was asked: good news of Paradise? The Prophet ﷺ said: yes, the good news of Paradise."},
      {t:"h",h:"How loudly"},
      {t:"hd",en:"Jibrīl told the Prophet ﷺ to tell his Companions to raise their voices when reciting the talbiyah."},
      {t:"list",items:["<b>Men</b> say the talbiyah out loud.","<b>Women</b> say it so that they can hear it themselves. If a non-maḥram is right close by and she feels awkward, she can recite it silently. A woman's voice is not ʿawrah, so she should recite it audibly enough to hear it."]},
      {t:"key",h:"Make sure you memorise the words of the talbiyah if you don't know them already. It's in the Memorise tab."},
      {t:"dua",kind:"The session closed with",ar:"سُبْحَانَكَ اللَّهُمَّ وَبِحَمْدِكَ أَشْهَدُ أَنْ لَا إِلَٰهَ إِلَّا أَنْتَ أَسْتَغْفِرُكَ وَأَتُوبُ إِلَيْكَ",en:"Glory be to You, O Allah, and praise. I bear witness that there is no god but You. I seek Your forgiveness and turn to You in repentance."}
    ]
  }
  ]
},
{
  id:"p3", num:"Part Three", title:"Ṭawāf", session:"Session 3",
  chapters:[
  {
    id:"s3c1", title:"Walking Is Worship Too", color:PAL.sage,
    summary:"Why building your stamina now lets you enjoy ṭawāf and saʿī.",
    blocks:[
      {t:"p",h:"I hope you have begun preparing for your Umrah mentally, spiritually and physically, and that you are building up your strength and increasing your daily walk."},
      {t:"p",h:"If you want to enjoy your Umrah and focus on ʿibādah while performing the rituals, you really need the physical capacity to walk. Many people get so tired in ṭawāf that all they can think about is the pain in their feet or legs. They are just counting down the rounds, and even in the saʿī they are waiting for it to be over so they can go and rest and eat."},
      {t:"p",h:"Of course this act of worship is physically tiring. But if you have built some capacity beforehand, it is easier to enjoy the worship."},
      {t:"all",items:[["2,000–3,000","Steps in each walk you go for"],["8,000–10,000","Steps a day in total"]]},
      {t:"key",h:"Every time you walk to build this capacity, it is counted as ʿibādah, because you are training yourself to worship Allah ﷻ better."},
      {t:"p",h:"Many people exercise to stay fit, so their clothes keep fitting, or so they don't age. All of that is good. But if you keep fit so that you may worship Allah ﷻ in an excellent way, then every moment you spend exercising and walking is counted as worship and is rewardable, in shāʾ Allāh."}
    ]
  },
  {
    id:"s3c2", title:"What Ṭawāf Is", color:PAL.lilac,
    summary:"Seven circuits from the Black Stone, legislated since the Kaʿbah was built.",
    blocks:[
      {t:"p",h:"Ṭawāf is one of the arkān of Umrah: without it the Umrah is incomplete and does not count."},
      {t:"key",h:"Ṭawāf is to walk around the Baytullāh, the Kaʿbah, seven times: beginning at the Black Stone (al-Ḥajar al-Aswad) and ending at the Black Stone. Seven complete circuits."},
      {t:"q",ar:"وَلْيَطَّوَّفُوا بِالْبَيْتِ الْعَتِيقِ",en:"And let them perform ṭawāf of the Ancient House.",ref:"Sūrat al-Ḥajj 22:29"},
      {t:"p",h:"Ṭawāf has been legislated by Allah ﷻ since the time the Kaʿbah was built. Allah commanded Ibrahim and Ismāʿīl:"},
      {t:"q",ar:"أَن طَهِّرَا بَيْتِيَ لِلطَّائِفِينَ وَالْعَاكِفِينَ وَالرُّكَّعِ السُّجُودِ",en:"Purify My House for those who perform ṭawāf, those who stay there in devotion, and those who bow and prostrate.",ref:"Sūrat al-Baqarah 2:125"},
      {t:"p",h:"Make sure the House of Allah is pure and clean for these worshippers, and among them those who make ṭawāf are mentioned first."},
      {t:"h",h:"The reward of ṭawāf"},
      {t:"hd",en:"Whoever does ṭawāf of the Kaʿbah seven times and prays two rakʿahs after it, it is as if he has freed a slave."},
      {t:"p",h:"These days we don't have the opportunity to free slaves, but this deed carries that reward. And the reward of freeing a slave is freedom from the Fire:"},
      {t:"hd",kind:"Narration",en:"When a person sets a slave free, Allah frees the one who freed him from the Fire, limb for limb."},
      {t:"hd",en:"Whoever does ṭawāf of the Kaʿbah, for every step he takes a good deed is written for him, a sin is erased, and a rank is raised."},
      {t:"key",h:"When the crowd makes your steps increase, don't become annoyed or weary. For every step you get a reward, a sin is erased and a rank is raised."}
    ]
  },
  {
    id:"s3c3", title:"Kinds of Ṭawāf", color:PAL.sky,
    summary:"Umrah, Hajj and voluntary ṭawāf: done the same way, with one difference.",
    blocks:[
      {t:"all",items:[["Ṭawāf of Umrah","A rukn; without it the Umrah is invalid"],["Ṭawāf al-Qudūm","Of Hajj"],["Ṭawāf al-Ifāḍah","Of Hajj"],["Ṭawāf al-Wadāʿ","Of Hajj"],["Voluntary ṭawāf","Any time of year, day or night"]]},
      {t:"p",h:"All the types of ṭawāf are performed in the same way. The only difference is iḥrām: for the ṭawāf of Umrah you must be in iḥrām, and for voluntary ṭawāf you don't have to be."},
      {t:"key",h:"Many people think that once they've done their Umrah, that's sufficient. Be eager to perform voluntary ṭawāf as well."}
    ]
  },
  {
    id:"s3c4", title:"Before You Begin", color:PAL.aqua,
    summary:"Purity, wuḍūʾ, intention, focus, stopping the talbiyah, and clothing.",
    blocks:[
      {t:"h",n:1,h:"Ṭahārah"},
      {t:"p",h:"Your clothes and body must be clean of any and all impurities."},
      {t:"h",n:2,h:"Wuḍūʾ"},
      {t:"p",h:"The majority of the ʿulamāʾ hold that a person must have wuḍūʾ, because of the hadith that ṭawāf is like salah: just as wuḍūʾ is required for salah, it is required for ṭawāf."},
      {t:"p",h:"Some ʿulamāʾ, especially in the Ḥanafī school, and this is also the preferred opinion of Ibn Taymiyyah, hold that wuḍūʾ is not a condition for the validity of ṭawāf, though it is highly recommended. The Prophet ﷺ made wuḍūʾ before ṭawāf, but he did not instruct people to be in wuḍūʾ, and if it were a condition he would have told them."},
      {t:"key",h:"It is definitely safer and more recommended to begin ṭawāf in a state of wuḍūʾ."},
      {t:"h",n:3,h:"Intention"},
      {t:"p",h:"If a person walks around the Kaʿbah seven times to digest a heavy dinner or to get more steps, that does not count as ṭawāf. You must intend that you are performing this act of worship. You don't have to say anything out loud, but the intention must be there, because "+ari("إِنَّمَا الْأَعْمَالُ بِالنِّيَّاتِ")+"."},
      {t:"h",n:4,h:"Khushūʿ"},
      {t:"p",h:"As you walk towards the Kaʿbah and during the ṭawāf, show humility and feel it in your heart. Bring about the fear of Allah and be conscious of Him. You are at the best place on earth, doing a most virtuous deed. Be conscious, alert and attentive."},
