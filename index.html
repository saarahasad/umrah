      {t:"p",h:"Be prepared beforehand: know what you are going to say during the ṭawāf and which du'as you will make, and stay focused."},
      {t:"h",n:5,h:"Stop the talbiyah"},
      {t:"p",h:"When you begin your ṭawāf, you stop saying "+ari("لَبَّيْكَ اللَّهُمَّ لَبَّيْكَ")+"."},
      {t:"h",n:6,h:"Clothing"},
      {t:"p",h:"The ʿawrah must be covered."},
      {t:"list",items:["<b>Men</b> doing the ṭawāf of Umrah are in iḥrām and do <em>iḍṭibāʿ</em>: uncovering the right shoulder. The teacher said this is in the first three rounds, and only for the ṭawāf of Umrah, not voluntary ṭawāf. Many ahadith mention that the Prophet ﷺ did this.","<b>Women</b> make sure they are properly covered: hair not showing, hijab proper, dressed appropriately."]},
      {t:"story",kind:"ʿAṭāʾ and Ibn Hishām",h:"<p>Ibn Hishām once ruled that women could not do ṭawāf with men at the same time. ʿAṭāʾ said: how can you do that, when the wives of the Prophet ﷺ used to perform ṭawāf with the men? He was asked how, with hijab. He said: yes, with hijab, there was a veil, and they would not mix with the men.</p>"},
      {t:"p",h:"So during ṭawāf, dress appropriately and, to the best of your ability, don't mix or bump into non-maḥram men."}
    ]
  },
  {
    id:"s3c5", title:"Istilām of the Black Stone", color:PAL.rose,
    summary:"The four ways to greet the Black Stone, and what not to do there.",
    blocks:[
      {t:"p",h:"You begin ṭawāf by going to the Black Stone and doing <em>istilām</em>: facing it and saying:"},
      {t:"dua",kind:"At the Black Stone",ar:"بِسْمِ اللَّهِ اللَّهُ أَكْبَرُ",en:"In the name of Allah. Allah is the Greatest."},
      {t:"h",h:"Four ways of istilām, in order"},
      {t:"h",n:1,h:"Touch it and kiss it"},
      {t:"hd",en:"The Prophet ﷺ was seen touching the Black Stone and kissing it.",ref:"Ṣaḥīḥ al-Bukhārī"},
      {t:"h",n:2,h:"Touch it with your hand, and kiss your hand"},
      {t:"p",h:"If you can't kiss it, touch the stone with your hand and kiss your hand. The Companions were seen doing this, and a hadith mentions it clearly."},
      {t:"h",n:3,h:"Touch it with something in your hand"},
      {t:"hd",en:"The Prophet ﷺ did ṭawāf on a camel and touched the corner with a stick with a curved end."},
      {t:"h",n:4,h:"Gesture from a distance"},
      {t:"p",h:"The most common way today because of the crowds. From wherever you are, even several feet away, face the Black Stone, raise your hand towards it and say the takbīr."},
      {t:"hd",en:"The Prophet ﷺ told ʿUmar: if you find a gap, go and kiss the Black Stone. If you cannot, just face it and say “Bismillāh, Allāhu Akbar”, or “Lā ilāha illā Allāh wa Allāhu Akbar”."},
      {t:"dua",kind:"Also said at the Black Stone",ar:"لَا إِلَٰهَ إِلَّا اللَّهُ وَاللَّهُ أَكْبَرُ",en:"There is no god but Allah, and Allah is the Greatest."},
      {t:"yn",items:[[0,"Kissing your hand after gesturing from a distance."],[0,"Blowing a flying kiss to the Black Stone."],[0,"Stopping at the Black Stone to make du'as. A crowd gathers and it becomes hard for others to keep moving."]]},
      {t:"key",h:"Istilām is done in every round. Just face it as you walk, say Bismillāh, Allāhu Akbar, and keep moving."},
      {t:"h",h:"When it's crowded"},
      {t:"p",h:"If it is crowded at the Black Stone, especially as a woman, don't try to reach it. Do the istilām from a distance."},
      {t:"story",kind:"ʿĀʾishah رضي الله عنها",h:"<p>Once while ʿĀʾishah was performing ṭawāf, a woman said to her: O Mother of the Believers, let us go and touch the Black Stone. ʿĀʾishah said: you go yourself. And she refused to go, because there were people there, it was already crowded, and it would cause more crowding.</p>"},
      {t:"p",h:"Many people become very eager to reach the Black Stone, touch it, face it for long, make du'as there and kiss their hands, and this causes a lot of problems for everyone else. Be considerate of others."}
    ]
  },
  {
    id:"s3c6", title:"Walking the Circuit", color:PAL.butter,
    summary:"Anticlockwise, outside the Ḥaṭīm, and within the masjid.",
    blocks:[
      {t:"all",items:[["Kaʿbah on your left","You walk anticlockwise"],["Outside the Ḥaṭīm","The semicircle is part of the Kaʿbah"],["Inside the masjid","In the maṭāf, or on the floors above"]]},
      {t:"h",h:"Go outside the Ḥaṭīm"},
      {t:"p",h:"The Ḥaṭīm is the semicircle next to the Kaʿbah. It marks the original foundations of the Kaʿbah, so the area inside it is actually part of the Kaʿbah. Your ṭawāf must go around all of the Kaʿbah. Don't take a shortcut through the inside of the Ḥaṭīm; that is not correct."},
      {t:"h",h:"Stay within the masjid"},
      {t:"p",h:"Ṭawāf is done within the masjid, in the maṭāf: either on the level of the Kaʿbah or on the floors above. That is correct too, because what matters is that you do ṭawāf of the Kaʿbah, not ṭawāf of the masjid. You don't do ṭawāf outside the masjid."},
      {t:"h",h:"One round"},
      {t:"p",h:"Do istilām and say Bismillāh, Allāhu Akbar, then walk a complete circuit until you reach the Black Stone again. That is one round. At the Black Stone corner do istilām again, in any of the four ways, and begin the next round. Repeat for all seven."}
    ]
  },
  {
    id:"s3c7", title:"The Corners of the Kaʿbah", color:PAL.peach,
    summary:"Which corners to touch, following the Sunnah, and the du'a between them.",
    blocks:[
      {t:"all",items:[["The Black Stone corner","One of the two Yamānī corners"],["Ar-Rukn al-Yamānī","The other Yamānī corner"],["The two Shāmī corners","On the side of the Ḥaṭīm"]]},
      {t:"p",h:"We only touch the Black Stone corner and ar-Rukn al-Yamānī. The two Shāmī corners, where the Ḥaṭīm is, are not touched."},
      {t:"story",kind:"Muʿāwiyah and Ibn ʿAbbās",h:"<p>When Muʿāwiyah did ṭawāf he would touch all four corners. Ibn ʿAbbās asked him why, when the Messenger of Allah ﷺ did not touch all four. Muʿāwiyah said: nothing of the House of Allah should be left out. Ibn ʿAbbās recited:</p>"},
      {t:"q",ar:"لَّقَدْ كَانَ لَكُمْ فِي رَسُولِ اللَّهِ أُسْوَةٌ حَسَنَةٌ",en:"Indeed, in the Messenger of Allah you have an excellent example.",ref:"Sūrat al-Aḥzāb 33:21"},
      {t:"p",h:"Muʿāwiyah said: you are right, and he accepted."},
      {t:"key",h:"You will see people touching every corner, holding on to the kiswah, or leaning against the walls of the Kaʿbah. Don't follow people blindly. Make sure what you do is according to the Sunnah, because the Prophet's ﷺ way is the most excellent way."},
      {t:"hd",en:"Ibn ʿUmar reported that when the Messenger of Allah ﷺ did ṭawāf, he would only touch the Black Stone and the Yamānī corner in each circuit."},
      {t:"h",h:"Ar-Rukn al-Yamānī"},
      {t:"yn",items:[[1,"Touch it with your hand if you can. It is not a requirement."],[0,"Kissing it."],[0,"Rubbing it and then wiping your hands on your face."],[0,"Pointing to it, raising your hand or saying Bismillāh, Allāhu Akbar at it."]]},
      {t:"p",h:"If you can't touch it, just keep moving."},
      {t:"h",h:"Between the Yamānī corner and the Black Stone"},
      {t:"dua",kind:"The Prophet ﷺ said this here",ar:"رَبَّنَا آتِنَا فِي الدُّنْيَا حَسَنَةً وَفِي الْآخِرَةِ حَسَنَةً وَقِنَا عَذَابَ النَّارِ",en:"Our Lord, give us good in this world and good in the Hereafter, and save us from the punishment of the Fire."}
    ]
  },
  {
    id:"s3c8", title:"Why We Kiss the Stone", color:PAL.blush,
    summary:"A stone from Paradise, a means of erasing sins, and only in the Prophet's ﷺ footsteps.",
    blocks:[
      {t:"hd",en:"The Black Stone descended from Paradise, and it was whiter than milk. It was blackened by the sins of the children of Ādam."},
      {t:"p",h:"So why do you kiss it? Because it is a stone from Jannah, and kissing is a way of expressing love."},
      {t:"hd",en:"Touching the Black Stone and the Yamānī corner erases sins."},
      {t:"story",kind:"From the teacher",h:"<p>“When we were younger, many times, alḥamdulillāh, we got the opportunity. We would go towards the Black Stone, and sometimes the guard would see us and literally clear space for us, and we would get to kiss it.”</p>"},
      {t:"p",h:"So especially men, young boys or young women: if you find an easy opportunity, excellent. If you can't kiss it, touch it."},
      {t:"key",h:"Don't slap, hit, push or injure anyone trying to reach the Black Stone or the Yamānī corner. This is not a place for fighting. You don't want to commit a sin in order to have your sins erased."},
      {t:"hd",en:"On the Day of Judgement the Black Stone will intercede for those who did istilām properly: whether they touched it, kissed it, touched it with something in their hand, or did istilām from a distance."},
      {t:"p",h:"This is why we should be eager to perform this ritual properly."},
      {t:"h",h:"Not for barakah"},
      {t:"p",h:"We kiss, touch or gesture to the Black Stone only in the footsteps of the Prophet ﷺ, not for barakah, and not because the stone is powerful in and of itself."},
      {t:"hd",kind:"ʿUmar رضي الله عنه said",en:"I know that you are just a stone. You can neither harm nor benefit. Had I not seen the Prophet ﷺ kissing you, I would not have kissed you."}
    ]
  },
  {
    id:"s3c9", title:"What to Say in Ṭawāf", color:PAL.mint,
    summary:"Ṭawāf is like salah: plan your seven rounds of Qur'an, dhikr, istighfār and du'a.",
    blocks:[
      {t:"hd",en:"Ṭawāf around the Kaʿbah is like prayer, except that you may speak during it. So whoever speaks during it, let him speak only what is good."},
      {t:"p",h:"Ṭawāf is for worshipping Allah ﷻ. In salah you recite Qur'an, make du'a, and glorify and praise Allah:"},
      {t:"dua",kind:"As in salah",ar:"سُبْحَانَ رَبِّيَ الْأَعْلَىٰ ۝ سُبْحَانَ رَبِّيَ الْعَظِيمِ ۝ سُبْحَانَكَ اللَّهُمَّ وَبِحَمْدِكَ وَتَبَارَكَ اسْمُكَ",en:"Glory be to my Lord, the Most High. Glory be to my Lord, the Most Great. Glory be to You, O Allah, and praise; blessed is Your name."},
      {t:"p",h:"This is exactly what you do in ṭawāf. You can literally hold the muṣḥaf and recite Qur'an as you walk, or say different tasbīḥāt:"},
      {t:"dua",kind:"Tasbīḥāt",ar:"لَا إِلَٰهَ إِلَّا أَنتَ سُبْحَانَكَ إِنِّي كُنتُ مِنَ الظَّالِمِينَ",en:"There is no god but You. Glory be to You. Indeed, I have been of the wrongdoers."},
      {t:"dua",kind:"Tasbīḥāt",ar:"سُبْحَانَ اللَّهِ وَالْحَمْدُ لِلَّهِ وَلَا إِلَٰهَ إِلَّا اللَّهُ وَاللَّهُ أَكْبَرُ",en:"Glory be to Allah, all praise is for Allah, there is no god but Allah, and Allah is the Greatest."},
      {t:"dua",kind:"Tasbīḥāt",ar:"لَا إِلَٰهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَىٰ كُلِّ شَيْءٍ قَدِيرٌ",en:"There is no god but Allah alone, with no partner. His is the dominion and His is the praise, and He has power over all things."},
      {t:"dua",kind:"Istighfār",ar:"أَسْتَغْفِرُ اللَّهَ وَأَتُوبُ إِلَيْهِ",en:"I seek Allah's forgiveness and turn to Him in repentance."},
      {t:"h",h:"Plan your rounds before you begin"},
      {t:"p",h:"Before you start, decide what each round is for. The teacher's example: the first two rounds for Qur'an, the third for tasbīḥāt, the fourth for istighfār, the fifth for du'as, with your du'a book in hand. Set yours here:"},
      {t:"plan"},
      {t:"h",h:"Go prepared"},
      {t:"p",h:"Some people start ṭawāf and look here and there, or talk, or are on their phones. This is very sad. Be prepared with what you will say, recite and ask for."},
      {t:"key",h:"Don't rely on phone apps. With the phone in your hand you'll be tempted: let me take a picture, let me open that app. Then something pops up and you're distracted."},
      {t:"p",h:"Ṭawāf is different from salah in that you may look around and talk to people, but only what is necessary. The focus should be on recitation, tasbīḥāt, du'as, dhikr and istighfār."},
      {t:"hd",en:"Ṭawāf of the Kaʿbah, going between Ṣafā and Marwah, and the stoning of the pillars have been ordained to establish the remembrance of Allah."},
      {t:"key",h:"The goal is not to walk seven times around the Kaʿbah. If it were, you could walk anywhere on the planet. The goal is to walk here with khushūʿ, busy remembering Allah. This is an act of worship, not physical exercise."},
      {t:"p",h:"You may speak what is good and necessary. For example, remind your child doing ṭawāf with you: let's say "+ari("لَا إِلَٰهَ إِلَّا أَنتَ سُبْحَانَكَ إِنِّي كُنتُ مِنَ الظَّالِمِينَ")+", or remind them to recite Qur'an, or correct their recitation."}
      ,{t:"yn",items:[[0,"“Look at that, this looks so nice.”"],[0,"“What did you eat? Are your feet okay? How was your plane ride?”"],[0,"“It's so nice to see you, I'm so happy we're doing Umrah together.”"],[0,"Telling the people with you your life story, your goals and dreams."]]}
      ,{t:"key",h:"Ṭawāf is not for chatting. Ṭawāf is for ʿibādah."}
      ,{t:"h",h:"Du'as led out loud in a group"}
      ,{t:"p",h:"Some groups have a person who says du'as out loud while everyone repeats after him. This is not from the Sunnah. If the Prophet ﷺ had seen benefit in it, he would have done it, and he did not. He led people in prayer, reciting the Qur'an while they listened, but in ṭawāf everyone makes their own personal du'as and dhikr."}
      ,{t:"p",h:"Saying it out loud also distracts everyone around, so no one can focus. Do ṭawāf with khushūʿ, softness and humility."}
    ]
  },
  {
    id:"s3c10", title:"Ramal", color:PAL.peach,
    summary:"Men walk briskly with short steps in the first three rounds.",
    blocks:[
      {t:"p",h:"In the first ṭawāf, for the first three rounds, men do <em>ramal</em>: walking fast with short steps. Not running around the Kaʿbah, and not big strides. Something like a jog, even slower than a jog, walking a little fast with short steps."},
      {t:"all",items:[["Men","Ramal in rounds 1–3, then normal walking for rounds 4–7"],["Women","Walk normally for all seven rounds"]]},
      {t:"h",h:"Why ramal"},
      {t:"hd",en:"When the Prophet ﷺ arrived for Umrah, before the conquest of Makkah, the Companions heard that the Quraysh were saying the Muslims had become weak. So the Prophet ﷺ told them to walk fast during ṭawāf, except between ar-Rukn al-Yamānī and the Black Stone."},
      {t:"p",h:"At first, the purpose of ramal was to show the strength of the Muslims. But on the Farewell Pilgrimage the Prophet ﷺ and the Companions still did ramal, so that the Muslims would remember their strength."},
      {t:"key",h:"Today there are no mushrikūn watching, and it isn't about proving anything. It is to remember the strength and bravery of the Muslims, so men still do ramal."}
    ]
  },
  {
    id:"s3c11", title:"Breaks, Wuḍūʾ and Salah", color:PAL.sky,
    summary:"Keep the rounds consecutive, what to do if wuḍūʾ breaks, and when the iqāmah is called.",
    blocks:[
      {t:"h",h:"Rounds must be consecutive"},
      {t:"p",h:"You can't do three rounds, say you're hungry, go and eat, and then come back to finish. The seven rounds are done one after the other."},
      {t:"yn",items:[[1,"A short break: sitting down for a few minutes to drink some water, then getting up and continuing."],[0,"A long break in the middle."]]},
      {t:"story",kind:"Example",h:"<p>You are doing ṭawāf with your child, and the child is crying or gets hurt. You stop to console them, and realise it's best to take them back to the hotel and put them to bed. When you come back, you begin the ṭawāf all over again, because it was a very long break.</p>"},
      {t:"h",h:"If your wuḍūʾ breaks"},
      {t:"p",h:"The majority of the ʿulamāʾ hold that wuḍūʾ is a prerequisite for ṭawāf. The minority opinion, which the teacher called the stronger one, is that wuḍūʾ is highly recommended but not required. So begin ṭawāf with wuḍūʾ."},
      {t:"p",h:"If your wuḍūʾ breaks halfway, or even in the seventh round, and you can renew it quickly and easily, do so. But if the only way is to go all the way back to the hotel, and you don't have the time or have a bus or train to catch, it is okay to complete the ṭawāf without wuḍūʾ. That is also a valid opinion."},
      {t:"p",h:"As for the Prophet ﷺ telling ʿĀʾishah to do everything in Hajj except ṭawāf: that was because she was menstruating. A menstruating woman does not do ṭawāf."},
      {t:"h",h:"When the iqāmah is called"},
      {t:"p",h:"If the adhān and iqāmah are called during your ṭawāf, you join the congregation and pray, then resume your ṭawāf."},
      {t:"list",items:["<b>Men</b> with the right shoulder uncovered cover both shoulders for the salah. The Prophet ﷺ forbade praying with the shoulders exposed.","After the salah, if it is the ṭawāf of Umrah and they are still in the rounds where it applies, they uncover the shoulder again and complete the ṭawāf."]},
      {t:"key",h:"Once the seven rounds are complete, men cover both shoulders for the rest of the Umrah."},
      {t:"h",h:"Any time of day or night"},
      {t:"p",h:"Ṭawāf can be done at any time, even at sunrise, sunset or when the sun is at its zenith. Voluntary prayer is not permissible at those times, but ṭawāf is."}
    ]
  },
  {
    id:"s3c12", title:"Manners in the Maṭāf", color:PAL.rose,
    summary:"What is not correct during ṭawāf, for your sake and everyone around you.",
    blocks:[
      {t:"yn",items:[
        [0,"Women wearing perfume that leaves a fragrance behind them, even in voluntary ṭawāf when not in iḥrām."],
        [0,"Women in full adornment (zīnah). It is not correct in a place like that."],
        [0,"Crowding, pushing and shoving, or stepping on people's feet. Respect people's personal space."],
        [0,"Reciting so loudly that people around you hear you."],
        [0,"Unnecessary talking on the phone or to each other, looking around, taking pictures, making videos."],
        [0,"Holding hands in a way that stops others from passing."],
        [0,"Doing ṭawāf on behalf of someone else. You only do ṭawāf for yourself."]
      ]},
      {t:"h",h:"Audible, but soft"},
      {t:"p",h:"When you recite, make du'a or dhikr, say it softly: loud enough that you can hear yourself, so you can focus, and soft enough that others can't hear you, so they can focus too."},
      {t:"h",h:"Don't tie yourselves together"},
      {t:"hd",en:"While the Prophet ﷺ was performing ṭawāf, he passed two people who had tied their hands together with a rope or string so they wouldn't lose each other. He cut it with his hand and said: lead him by the hand."},
      {t:"p",h:"If you have to lead someone, hold their hand, but don't tie them. In a crowd, if one trips the other trips too, and two people falling together can cause a stampede or a crush. It can be very dangerous."}
    ]
  },
  {
    id:"s3c13", title:"Two Rakʿahs at Maqām Ibrāhīm", color:PAL.butter,
    summary:"After the seventh round: the ayah, the two sūrahs, and where to pray.",
    blocks:[
      {t:"p",h:"When you complete the seven rounds, go towards Maqām Ibrāhīm. When the Prophet ﷺ completed his seven circuits, he walked towards the Maqām reciting:"},
      {t:"q",ar:"وَاتَّخِذُوا مِن مَّقَامِ إِبْرَاهِيمَ مُصَلًّى",en:"And take the standing place of Ibrāhīm as a place of prayer.",ref:"Sūrat al-Baqarah 2:125"},
      {t:"p",h:"We do the same: walk towards the Maqām reciting this ayah, then pray two rakʿahs as he did."},
      {t:"all",items:[["1st rakʿah","Qul yā ayyuha-l-kāfirūn"],["2nd rakʿah","Qul huwa Allāhu aḥad"]]},
      {t:"p",h:"Pray facing the Kaʿbah with Maqām Ibrāhīm in front of you."},
      {t:"h",h:"If you can't pray right there"},
      {t:"p",h:"Often you will be far from the Maqām. Don't stand and pray where people are walking for ṭawāf; that causes them great inconvenience. You can pray anywhere in the masjid, or even outside it. If you lose your wuḍūʾ on the way to the Maqām, you can even pray in your hotel room."},
      {t:"list",items:["<b>Forgot them?</b> Say you went straight to Ṣafā and Marwah and started saʿī, then remembered. It's okay. Pray the two rakʿahs whenever you remember, but you do have to pray them.","<b>ʿUmar</b> رضي الله عنه performed ṭawāf and then prayed the two rakʿahs after he had left the vicinity of the Ḥaram, not just the masjid.","<b>A farḍ salah does not count for them.</b> If you finish ṭawāf at Fajr and pray the sunnah and the farḍ with the imām, you still pray the two rakʿahs of Maqām Ibrāhīm separately."]},
      {t:"key",h:"This is part of every ṭawāf, voluntary or of Umrah: after the seven rounds, two rakʿahs at Maqām Ibrāhīm."},
      {t:"h",h:"What the Maqām is"},
      {t:"p",h:"It is the stone Ibrāhīm عليه السلام stood on while building the Kaʿbah. The stone would rise so he could build the walls high, while Ismāʿīl عليه السلام passed him the stones. In another hadith we learn that it too is from Paradise."},
      {t:"p",h:"The Companions greatly revered it. ʿUmar رضي الله عنه said to the Prophet ﷺ: if only we could pray here. And Allah revealed the ayah above."}
    ]
  },
  {
    id:"s3c14", title:"Zamzam", color:PAL.aqua,
    summary:"Drink it standing, pour it on yourself, and make du'a with every sip.",
    blocks:[
      {t:"hd",en:"When the Prophet ﷺ completed the ṭawāf, he went to where the Zamzam water is, drank from it, and poured it on his head."},
      {t:"p",h:"It is sunnah to drink Zamzam and to pour it on yourself. Zamzam came out when Ismāʿīl was a baby and his mother was searching for water for her thirsty child. The angel dug the earth with his heel, or his wing, until water flowed from that place."},
      {t:"h",h:"Its virtues"},
      {t:"list",items:["It is the best water on the face of the earth, and it is blessed.","It is "+ari("طَعَامُ طُعْمٍ")+": food for the one who eats. It suffices as drink and as food.","It is a healing for disease, and good for bringing down a fever, both drinking it and pouring it."]},
      {t:"p",h:"So if you can't eat, because there is no food, or you have nausea, or the children are fussy with the time difference and fatigue, drinking Zamzam is excellent because it suffices as food. Ibn ʿAbbās said: we called Zamzam <em>Shabbāʿah</em>, the one that satisfies, and we found it very helpful in feeding our families and children."},
      {t:"hd",ar:"مَاءُ زَمْزَمَ لِمَا شُرِبَ لَهُ",en:"The water of Zamzam is for whatever it is drunk for."},
      {t:"key",h:"The du'a you make when drinking Zamzam is accepted."},
      {t:"h",h:"How to drink it"},
      {t:"list",items:["Stand while you drink. That is the sunnah.","Make du'a right before a sip, during the sip in your heart, and right after it.","Or: take a sip, make du'a; another sip, du'a; a third sip, du'a."]},
      {t:"h",h:"More from the Sunnah"},
      {t:"list",items:["You can make wuḍūʾ with Zamzam.","Serve Zamzam to others. That is rewardable too.","Bring Zamzam back home. You're not being greedy; it is from the Sunnah, as ʿĀʾishah رضي الله عنها reported. The Prophet ﷺ would also have Zamzam sent to him in Madinah."]},
      {t:"h",h:"Then back to the Black Stone"},
      {t:"p",h:"After drinking Zamzam at the water coolers, go back to the Black Stone and do istilām again, in any of the four ways. Your ṭawāf is now complete, and you move on to the next ritual: saʿī."}
    ]
  },
  {
    id:"s3c15", title:"The Multazam", color:PAL.lilac,
    summary:"The place of clinging, between the Black Stone and the door of the Kaʿbah.",
    blocks:[
      {t:"p",h:"Between the Black Stone and the door of the Kaʿbah is a very small area called the <em>Multazam</em>, the place of clinging. People place their chest, face, arms and palms against the wall of the Kaʿbah there and make du'a. This is correct."},
      {t:"key",h:"It is not a requirement. For most women it isn't something they can even imagine doing. For men, if it's easily possible, it is excellent, in shāʾ Allāh."},
      {t:"story",kind:"From the Q&A · Can men buy iḥrām in Madinah?",h:"<p>You should be able to. But if you can, buy it before you go: find out where to get it locally, or check online. That way you can make sure it is washed, has no fragrance on it, and is ready to wear, and you don't spend your time in Madinah looking for iḥrām.</p>"}
    ]
  },
  {
    id:"s3c16", title:"Ṭawāf Step by Step", color:PAL.mint,
    summary:"The whole ṭawāf of Umrah in order, as taught in this session.",
    blocks:[
      {t:"steps",items:[
        ["Prepare","Be clean, in wuḍūʾ, with the intention of ṭawāf. Stop the talbiyah. Men uncover the right shoulder (iḍṭibāʿ). Know your plan for the rounds."],
        ["Start at the Black Stone","Do istilām in whichever of the four ways you can: face it and say “Bismillāh, Allāhu Akbar”. Keep moving."],
        ["Walk seven rounds","Kaʿbah on your left, outside the Ḥaṭīm. Men do ramal in rounds 1–3. Touch ar-Rukn al-Yamānī if you can, say “Rabbanā ātinā…” from there to the Black Stone, and do istilām at the Black Stone each round."],
        ["Finish","After the seventh round, men cover both shoulders."],
        ["Maqām Ibrāhīm","Walk towards it reciting “wattakhidhū min maqāmi Ibrāhīma muṣallā”. Pray two rakʿahs with al-Kāfirūn and al-Ikhlāṣ, wherever there's space."],
        ["Zamzam","Drink it standing, make du'a with each sip, and pour some on your head."],
        ["Back to the Black Stone","Istilām once more. Your ṭawāf is complete."],
        ["On to saʿī","Head to Ṣafā and Marwah."]
      ]},
      {t:"dua",kind:"The session closed with",en:"Bārak Allāhu fīkum."}
    ]
  }
  ]
},
{
  id:"p4", num:"Part Four", title:"Saʿī", session:"Session 4",
  chapters:[
  {
    id:"s4c1", title:"What Saʿī Is", color:PAL.sand,
    summary:"Seven legs between Ṣafā and Marwah, done willingly for Allah.",
    blocks:[
      {t:"dua",kind:"Each session opens with",ar:"رَبِّ اشْرَحْ لِي صَدْرِي ۝ وَيَسِّرْ لِي أَمْرِي ۝ وَاحْلُلْ عُقْدَةً مِّن لِّسَانِي ۝ يَفْقَهُوا قَوْلِي",en:"My Lord, expand for me my chest, ease for me my task, and untie the knot from my tongue so they may understand my speech."},
      {t:"p",h:"<em>As-saʿī bayna aṣ-Ṣafā wa-l-Marwah</em> is going back and forth between Ṣafā and Marwah. It is one of the pillars of Umrah: going seven times between the two hills with the intention of worship."},
      {t:"p",h:"Ṣafā and Marwah are two hills. They don't look much like hills today, but their spots are well known and well preserved."},
      {t:"key",h:"Ṣafā to Marwah is one round. Marwah back to Ṣafā is the second. Seven complete rounds: saʿī begins at Ṣafā and ends at Marwah."},
      {t:"p",h:"Before saʿī you must have completed your ṭawāf, prayed the two rakʿahs at Maqām Ibrāhīm, and done istilām of the Black Stone. Then you go towards Ṣafā."},
      {t:"q",ar:"إِنَّ الصَّفَا وَالْمَرْوَةَ مِن شَعَائِرِ اللَّهِ ۖ فَمَنْ حَجَّ الْبَيْتَ أَوِ اعْتَمَرَ فَلَا جُنَاحَ عَلَيْهِ أَن يَطَّوَّفَ بِهِمَا ۚ وَمَن تَطَوَّعَ خَيْرًا فَإِنَّ اللَّهَ شَاكِرٌ عَلِيمٌ",en:"Indeed, Ṣafā and Marwah are among the symbols of Allah. So whoever makes Hajj to the House or performs Umrah, there is no blame upon him for walking between them. And whoever volunteers good, then indeed Allah is Appreciative and Knowing.",ref:"Sūrat al-Baqarah 2:158"},
      {t:"h",h:"What this ayah teaches"},
      {t:"list",items:["<b>They are shaʿāʾir Allāh:</b> places Allah has chosen for His religion, for the performance of certain rituals.","<b>Saʿī is part of Hajj and of Umrah.</b> Neither is complete without it.","<b>Do it willingly and happily.</b> "+ari("وَمَن تَطَوَّعَ خَيْرًا")+": whoever does good willingly."]},
      {t:"p",h:"Walking seven times between two hills is quite a walk, and men have to run part of it. It can be tiring, and for some people very exhausting. For the average person it still takes effort and energy."},
      {t:"key",h:"Allah is <b>Shākir</b>: He appreciates every step you take and all the effort you put in. And He is <b>ʿAlīm</b>: He knows your intention, your state, how much your feet, knees or back are hurting. He appreciates, and He rewards."},
      {t:"p",h:"Many people feel energetic and emotional in ṭawāf, close to the Kaʿbah. By the time they reach saʿī they are tired, they are counting the rounds, and further from the Kaʿbah they don't feel the same emotional high. Remember then: I am doing this because Allah commanded it, and I will do it willingly and happily. And you will find Allah Shākir and ʿAlīm."}
    ]
  },
  {
    id:"s4c2", title:"Why “No Blame”?", color:PAL.peri,
    summary:"Why the ayah is worded this way, and why saʿī is not optional.",
    blocks:[
      {t:"hd",kind:"Anas ibn Mālik رضي الله عنه",en:"Anas was asked: did you use to dislike going between Ṣafā and Marwah? He said: yes, because they were among the waymarks of the Jāhiliyyah, until Allah revealed: “Indeed, Ṣafā and Marwah are among the symbols of Allah.”"},
      {t:"p",h:"The mushrikūn had placed idols at Ṣafā and Marwah and did saʿī even before Islam, so the Muslims were afraid that doing saʿī would be wrong. Allah removed this confusion with this ayah: there is no blame on the one doing Hajj or Umrah in going between them."},
      {t:"story",kind:"ʿUrwah and ʿĀʾishah رضي الله عنها",h:"<p>ʿUrwah said to ʿĀʾishah: by Allah, it is evident from this ayah that there is no harm if a person does not go between Ṣafā and Marwah. It seems optional.</p><p>She said: O my nephew, your interpretation is not correct. If it were, Allah would have said: there is no blame on him if he does <em>not</em> go between them. But He said there is no blame on him if he <em>does</em>.</p><p>Then she explained that the ayah was revealed about the Anṣār. Before Islam, whoever put on iḥrām to worship the idol Manāt would not do saʿī between Ṣafā and Marwah. When they embraced Islam they asked the Messenger of Allah ﷺ about it, and Allah revealed this ayah.</p>"},
      {t:"key",h:"Don't be confused by the wording. Saʿī is not optional. The wording removes the Companions' fear: saʿī is not a pagan tradition, it is something Allah has legislated."}
    ]
  },
  {
    id:"s4c3", title:"In the Footsteps of Hājar", color:PAL.blush,
    summary:"Where saʿī began: a mother searching for water for her child.",
    blocks:[
      {t:"story",kind:"From the hadith",h:"<p>When Ibrāhīm left Hājar and Ismāʿīl in Makkah, she nursed her son and drank from the water she had. When it ran out, she and her child both became thirsty. She saw the baby tossing in agony, and she left him because she could not bear to watch.</p><p>Ṣafā was the nearest mountain to her. She climbed it and looked across the valley hoping to see someone, but saw no one. She came down, and when she reached the valley she tucked up her robe and ran like a person in distress until she crossed it and reached Marwah. She stood there and looked, but saw no one.</p><p>She went back and forth, Ṣafā to Marwah and Marwah to Ṣafā, seven times.</p>"},
      {t:"hd",en:"The Prophet ﷺ said: this is the source of the tradition of people walking between them."},
      {t:"p",h:"Imagine a nursing mother, thirsty, with no water, watching her child unable to get any milk."},
      {t:"story",kind:"The seventh time",h:"<p>When she reached Marwah for the last time, she heard a voice. She told herself to be quiet and listened. She heard it again and said: whoever you are, you have made me hear your voice; have you got something to help me? And there she saw an angel at the place of Zamzam, digging the earth with his heel, or his wing, until water flowed.</p>"},
      {t:"key",h:"This is the real reason we do saʿī. It is not a pagan tradition. Saʿī is done in the footsteps of Hājar."}
    ]
  },
  {
    id:"s4c4", title:"An Obligation, and Its Reward", color:PAL.rose,
    summary:"Allah decreed it, the Prophet ﷺ ran it, and it carries a great reward.",
    blocks:[
      {t:"p",h:"Saʿī is a mandatory part of Umrah and must not be left. If a person leaves it, their Umrah is not valid."},
      {t:"hd",en:"The Prophet ﷺ was going between Ṣafā and Marwah, running in the valley between them, exerting so much effort that his lower garment twisted around his legs. And he was saying to the Companions:"},
      {t:"hd",ar:"اسْعَوْا فَإِنَّ اللَّهَ كَتَبَ عَلَيْكُمُ السَّعْيَ",en:"Perform saʿī, for Allah has decreed saʿī upon you."},
      {t:"h",h:"What saʿī means"},
      {t:"p",h:"<em>Saʿī</em> primarily means to walk quickly, and it is sometimes used for running or rushing. On the slopes of the two hills you walk. The valley between them is crossed running."},
      {t:"key",h:"You won't see the valley today, but you will see two very visible green lights. That is where the valley was. Men run between them."},
      {t:"h",h:"The reward"},
      {t:"hd",en:"The reward of doing saʿī is like freeing seventy slaves."},
      {t:"p",h:"Allāhu Akbar."},
      {t:"hd",kind:"Ibn ʿUmar رضي الله عنهما",en:"The Prophet ﷺ arrived in Makkah, did ṭawāf of the Kaʿbah, prayed two rakʿahs, then went between Ṣafā and Marwah. And Ibn ʿUmar recited: “Indeed, in the Messenger of Allah you have an excellent example.”"},
      {t:"p",h:"We do saʿī because the Prophet ﷺ did saʿī."},
      {t:"h",h:"Why run"},
      {t:"p",h:"Ibn ʿAbbās explained that one reason was to show the Muslims' strength. When the Muslims came together for Umrah for the first time, the mushrikūn watched from a distance mocking them: look how weak they've become. So men run part of ṭawāf, and in saʿī the valley is crossed running. The mushrikūn are no longer there, but we still do it to remember our strength."},
      {t:"h",h:"Seven"},
      {t:"hd",ar:"رَمْيُ الْجِمَارِ تَوٌّ وَالسَّعْيُ بَيْنَ الصَّفَا وَالْمَرْوَةِ تَوٌّ وَالطَّوَافُ تَوٌّ",en:"Stoning the pillars is an odd number, going between Ṣafā and Marwah is an odd number, and ṭawāf is an odd number: seven times."}
    ]
  },
  {
    id:"s4c5", title:"Wuḍūʾ for Saʿī", color:PAL.aqua,
    summary:"Not a requirement, but better to have.",
    blocks:[
      {t:"p",h:"Do you need to be in wuḍūʾ for saʿī? No. Wuḍūʾ is not a requirement for saʿī."},
      {t:"hd",kind:"ʿĀʾishah رضي الله عنها",en:"She was going for Hajj with the Prophet ﷺ when her menstruation began, and she was crying. He consoled her: this is something Allah has decreed for the daughters of Ādam. Do what the pilgrims do, except ṭawāf around the Kaʿbah, until you are purified."},
      {t:"p",h:"He only told her not to do ṭawāf, so she could do everything else, including saʿī. If a menstruating woman can do saʿī, then certainly a person without wuḍūʾ can."},
      {t:"key",h:"It is still better to have wuḍūʾ: if the adhān and iqāmah are called during your saʿī, you have to join the congregation and pray right away."}
    ]
  },
  {
    id:"s4c6", title:"At Ṣafā", color:PAL.butter,
    summary:"What to recite, where to face, and the dhikr to say three times with du'a.",
    blocks:[
      {t:"hd",kind:"Jābir رضي الله عنه",en:"The Prophet ﷺ went out of the gate to aṣ-Ṣafā, and as he came near it he recited “Indeed, Ṣafā and Marwah are among the symbols of Allah,” and said: “I begin with what Allah began with.” He climbed Ṣafā until he saw the Kaʿbah, faced the qiblah, declared Allah's oneness and greatness, and said the words below. He repeated them three times, making du'a in between. Then he came down and went towards Marwah."},
      {t:"h",h:"Step by step"},
      {t:"steps",items:[
        ["Walk towards Ṣafā","After istilām of the Black Stone, follow the signs to Ṣafā. They are very clear."],
        ["As you near it, recite",ari("إِنَّ الصَّفَا وَالْمَرْوَةَ مِن شَعَائِرِ اللَّهِ")+"<br>Only this part of the ayah."],
        ["Then say",ari("أَبْدَأُ بِمَا بَدَأَ اللَّهُ بِهِ")+"<br>I begin with what Allah began with. Allah mentions Ṣafā before Marwah, so you begin at Ṣafā, not Marwah."],
        ["Face the qiblah","Climb and turn towards the Kaʿbah. With the crowds you may not see it; do your best. If you can see it, even better."],
        ["Say the dhikr three times","With du'a after the first, after the second, and after the third. This is the time for du'a."],
        ["Descend towards Marwah","Your first round begins."]
      ]},
      {t:"dua",kind:"First",ar:"لَا إِلَٰهَ إِلَّا اللَّهُ وَاللَّهُ أَكْبَرُ",en:"There is no god but Allah, and Allah is the Greatest."},
      {t:"dua",kind:"Then, three times, with du'a in between",ar:"لَا إِلَٰهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَىٰ كُلِّ شَيْءٍ قَدِيرٌ لَا إِلَٰهَ إِلَّا اللَّهُ وَحْدَهُ أَنْجَزَ وَعْدَهُ وَنَصَرَ عَبْدَهُ وَهَزَمَ الْأَحْزَابَ وَحْدَهُ",en:"There is no god worthy of worship but Allah alone, with no partner. To Him belongs all dominion and all praise, and He is able to do all things. There is no god but Allah alone. He fulfilled His promise, helped His slave, and routed the confederates alone."},
      {t:"p",h:"“Routed the confederates alone” refers to how Makkah was conquered without a battle: Allah gave His Messenger ﷺ victory, routing all the different groups Himself."},
      {t:"h",h:"Practise it now"},
      {t:"p",h:"Many people approach Ṣafā with a book in hand, reading these words for the first time. It takes so long that they give up and just walk between Ṣafā and Marwah without the words or any du'a. The saʿī still counts, but you are travelling so far, spending so much and exerting so much effort. You want to maximise the reward, and you do that by following the Sunnah."},
      {t:"key",h:"Memorise this dhikr. If you can't, read it enough times from now that you are fluent: smooth, not rushing, and not struggling with the ḥarakāt or panicking because everyone has moved on. It's in the Memorise tab."}
    ]
  },
  {
    id:"s4c7", title:"From Ṣafā to Marwah", color:PAL.sage,
    summary:"Running between the green lights, and the du'a of saʿī.",
    blocks:[
      {t:"p",h:"Come down from Ṣafā and head towards Marwah. There is no valley today, so you walk, and men run between the two green lights."},
      {t:"dua",kind:"The du'a of saʿī",ar:"رَبِّ اغْفِرْ وَارْحَمْ وَأَنْتَ الْأَعَزُّ الْأَكْرَمُ",en:"My Lord, forgive and have mercy, and You are truly the Most Mighty, the Most Honourable."},
      {t:"h",h:"Men: don't take the running lightly"},
      {t:"p",h:"The Prophet ﷺ ran in the valley between Ṣafā and Marwah. In one hadith his lower garment rose very high from running, and in another it twisted around his legs. He wasn't just walking fast; he was running fast."},
      {t:"h",h:"If you can't run"},
      {t:"hd",kind:"Ibn ʿUmar رضي الله عنهما",en:"A man said to him: I see you walking in the valley while people are running. He said: if I walk, it is because I saw the Messenger of Allah ﷺ walk, and if I run, it is because I saw him run. And I am now too old."},
      {t:"p",h:"So if a man can't run because of pain, injury or old age, it is fine to walk through the valley."},
      {t:"all",items:[["Men","Run between the green lights if able"],["Women","Walk at a normal pace throughout"]]}
    ]
  },
  {
    id:"s4c8", title:"At Marwah, and Back", color:PAL.lilac,
    summary:"Stand, face the qiblah, repeat the dhikr, and complete the seven legs.",
    blocks:[
      {t:"hd",en:"When the Prophet ﷺ began to ascend al-Marwah, he walked until he reached the top, and there he did as he had done at aṣ-Ṣafā."},
      {t:"p",h:"So at Marwah you do what you did at Ṣafā, except you don't say "+ari("أَبْدَأُ بِمَا بَدَأَ اللَّهُ بِهِ")+", because you have already begun."},
      {t:"list",items:["Recite "+ari("إِنَّ الصَّفَا وَالْمَرْوَةَ مِن شَعَائِرِ اللَّهِ")+".","Face the qiblah and say "+ari("لَا إِلَٰهَ إِلَّا اللَّهُ وَاللَّهُ أَكْبَرُ")+".","Say the full dhikr three times, making du'a in between.","Then descend and head back to Ṣafā, and do the same there."]},
      {t:"key",h:"Many people don't stop at Marwah. They just touch it and start walking back towards Ṣafā. That is not correct. Stand on the hill, say the dhikr, and make du'a."},
      {t:"h",h:"The seven legs"},
      {t:"steps",items:[["Ṣafā → Marwah","Round 1"],["Marwah → Ṣafā","Round 2"],["Ṣafā → Marwah","Round 3"],["Marwah → Ṣafā","Round 4"],["Ṣafā → Marwah","Round 5"],["Marwah → Ṣafā","Round 6"],["Ṣafā → Marwah","Round 7. Your saʿī ends at Marwah."]]},
      {t:"key",h:"On the seventh round, when you ascend Marwah for the last time, you do not recite the ayah or the dhikr. Your saʿī is complete."}
    ]
  },
  {
    id:"s4c9", title:"Dhikr and Manners in Saʿī", color:PAL.mint,
    summary:"What to say as you walk, reviving the Sunnah on the hills, and taking your time.",
    blocks:[
      {t:"p",h:"As you walk between the hills, say the du'a of saʿī, "+ari("رَبِّ اغْفِرْ وَارْحَمْ وَأَنْتَ الْأَعَزُّ الْأَكْرَمُ")+", and you can also say other adhkār, such as:"},
      {t:"dua",kind:"Dhikr",ar:"سُبْحَانَ اللَّهِ وَالْحَمْدُ لِلَّهِ وَلَا إِلَٰهَ إِلَّا اللَّهُ وَاللَّهُ أَكْبَرُ",en:"Glory be to Allah, all praise is for Allah, there is no god but Allah, and Allah is the Greatest."},
      {t:"hd",en:"Ṭawāf of the Kaʿbah, going between Ṣafā and Marwah, and the stoning of the pillars have been legislated "+ari("لِإِقَامَةِ ذِكْرِ اللَّهِ")+": to establish the remembrance of Allah."},
      {t:"h",h:"Revive the Sunnah on the hills"},
      {t:"p",h:"Make du'a when you reach Ṣafā, and make du'a when you reach Marwah. Many people neglect this Sunnah. When you are there you will hardly see anyone making the effort to stand, recite the adhkār and make du'a on the hills. Don't be of those who neglect it. Revive it."},
      {t:"key",h:"If your saʿī feels long because you are standing, saying the dhikr three times and making du'a, remind yourself: I didn't come all this way to quickly do my saʿī and go back to the hotel to sleep. I came to do my Umrah. I will take my time, relax, and focus on every part of this ʿibādah to maximise the reward."},
      {t:"list",items:["<b>Keep your intention in mind.</b> Remember the reward, the importance and the virtues of saʿī, and why you are doing it.","<b>Don't spend it chatting.</b> Focus on the dhikr of Allah and du'a.","<b>Men run only in the valley,</b> between the green lights. Some people run all the way from the top of Ṣafā to the top of Marwah. That is not correct."]}
    ]
  },
  {
    id:"s4c10", title:"If You Can't Walk", color:PAL.sky,
    summary:"Doing ṭawāf or saʿī on a ride or wheelchair, and staying in the designated area.",
    blocks:[
      {t:"p",h:"If a person genuinely cannot walk seven times between Ṣafā and Marwah on their feet, may they do saʿī on some kind of ride? Yes, that is permissible."},
      {t:"key",h:"Doing it on your feet is certainly better, because the Prophet ﷺ and his Companions did saʿī on foot."},
      {t:"hd",kind:"Jābir رضي الله عنه",en:"On the Farewell Pilgrimage the Prophet ﷺ performed ṭawāf, saʿī, and even istilām of the Black Stone riding his camel. Jābir explained that he did this so people could see him and he would not be hidden, and so they could find him to ask their questions, because there was a huge crowd around him."},
      {t:"p",h:"So if there is a reason, there is nothing wrong with performing these rituals on some means of transport. For example:"},
      {t:"chips",items:["The elderly","A foot injury","Feet that hurt walking barefoot for long","Pregnancy","Little children","Physical weakness","Illness","Disability"]},
      {t:"hd",kind:"Umm Salamah رضي الله عنها",en:"She complained to the Prophet ﷺ of her illness, and he told her to perform ṭawāf riding, behind the people."},
      {t:"p",h:"Two things: he told her to ride because she was ill, and to do it behind the people, so the camel would not come among those walking and accidentally hurt or bump into someone."},
      {t:"key",h:"If you are using a wheelchair or similar, stay in the designated area, away from those walking. Don't go into the area for people on foot; you don't want to injure someone inadvertently."}
    ]
  },
  {
    id:"s4c11", title:"Salah and Breaks in Saʿī", color:PAL.peach,
    summary:"Pausing for congregation, and resting between ṭawāf and saʿī.",
    blocks:[
      {t:"h",h:"When it's time to pray"},
      {t:"p",h:"If it is time for salah during your saʿī, pause and pray in congregation. Then resume your saʿī from where you stopped. You don't start again. This applies to women too, not just men."},
      {t:"h",h:"A break between ṭawāf and saʿī"},
      {t:"p",h:"If you can't do saʿī straight after ṭawāf, there is nothing wrong with taking a break in between."},
      {t:"hd",kind:"ʿAṭāʾ and al-Ḥasan al-Baṣrī",en:"They would do ṭawāf in the morning and saʿī later in the day, and saw no problem in it."},
      {t:"story",kind:"Example",h:"<p>You finish ṭawāf and it's really hot. You are very tired and won't be able to focus on ʿibādah or do everything properly. It's better to rest a little: eat something, take a short power nap, freshen up, and then come back for saʿī. There is nothing wrong with that.</p>"},
      {t:"key",h:"You are still in iḥrām during the break and during saʿī, so keep to the rules of iḥrām."}
    ]
  },
  {
    id:"s4c12", title:"Shaving or Trimming", color:PAL.blush,
    summary:"The final step: ḥalq or taqṣīr, and your Umrah is complete.",
    blocks:[
      {t:"p",h:"After saʿī comes <em>ḥalq</em> or <em>taqṣīr</em>."},
      {t:"all",items:[["Ḥalq","Shaving the head: for men"],["Taqṣīr","Trimming the hair of the head: for men and women"]]},
      {t:"hd",kind:"Muʿāwiyah رضي الله عنه",en:"I clipped the hair of the Messenger of Allah ﷺ with a clipper while he was at al-Marwah."},
      {t:"hd",en:"When the Prophet ﷺ came to Makkah, he ordered his Companions to perform ṭawāf of the Kaʿbah, then saʿī between Ṣafā and Marwah, then to finish their iḥrām and have their hair shaved off or cut short."},
      {t:"p",h:"So men have both options. And the Prophet ﷺ made du'a:"},
      {t:"hd",ar:"اللَّهُمَّ اغْفِرْ لِلْمُحَلِّقِينَ",en:"“O Allah, forgive those who shave their heads.” The Companions said: “And those who trim?” He said again: “O Allah, forgive those who shave.” This happened three times, and then he said: “And those who trim.”"},
      {t:"key",h:"The rank of men who shave after saʿī is greater than of those who only trim. But he also prayed for those who trim, so there is nothing wrong with trimming."},
      {t:"h",h:"Women"},
      {t:"hd",en:"Shaving the head is not a duty laid on women. Only clipping the hair is incumbent on them."},
      {t:"h",h:"Where and when"},
      {t:"list",items:["You can trim your hair at Marwah at the end of the seventh round. Some people carry clippers or small scissors in their bag and cut some hair right there.","If that isn't possible, say you don't have scissors or really need the bathroom, you can go back to the hotel and trim or shave there.","Many men trim a little at Marwah, then go and eat, and have their heads shaved later. It doesn't have to be done right there; you can delay it a little."]},
      {t:"h",h:"Razor, clippers or barber"},
      {t:"p",h:"The Prophet ﷺ used a clipper. That doesn't mean he didn't shave the head; it means he didn't use a razor. So you don't need a razor to shave the head clean. Use whatever tool you have."},
      {t:"p",h:"You can go to a barber, but finding a good one and waiting can take very long. To save time, take clippers with you and shave in the hotel bathroom, properly, and not in the sink, so nothing gets clogged."},
      {t:"cta2",h:"With that, alḥamdulillāh, your Umrah is complete. May Allah ﷻ give us all tawfīq, and may He accept it from all of us. Āmīn."},
      {t:"dua",kind:"The session closed with",ar:"سُبْحَانَكَ اللَّهُمَّ وَبِحَمْدِكَ أَشْهَدُ أَنْ لَا إِلَٰهَ إِلَّا أَنْتَ أَسْتَغْفِرُكَ وَأَتُوبُ إِلَيْكَ",en:"Glory be to You, O Allah, and praise. I bear witness that there is no god but You. I seek Your forgiveness and turn to You in repentance."}
    ]
  }
  ]
}
];

/* hero: one ring per chapter, turning anticlockwise like ṭawāf */
function mataf(part){
  const n = part.chapters.length;
  const r0 = 36, step = Math.min(8, 50/Math.max(n-1,1));
  let rings = "";
  part.chapters.forEach((c,i)=>{
    const r = r0 + i*step;
    rings += state.read[c.id]
      ? `<circle cx="100" cy="100" r="${r}" fill="none" stroke="#C0677F" stroke-width="2.2"/>`
      : `<circle cx="100" cy="100" r="${r}" fill="none" stroke="#C0677F" stroke-opacity=".35" stroke-width="1.1" stroke-dasharray="1.5 4"/>`;
  });
  const outer = r0 + (n-1)*step;
  return `<svg class="mataf" viewBox="0 0 200 200" role="img" aria-label="${countRead(part)} of ${n} chapters read, shown as rings around the Kaʿbah">
    <circle cx="100" cy="100" r="${outer+9}" fill="#FFF7F9" fill-opacity=".55"/>
    <g class="spin">${rings}<circle cx="100" cy="${100-outer-4}" r="2.8" fill="#C0677F"/></g>
    <line x1="85" y1="115" x2="${100-(outer+9)*0.7071}" y2="${100+(outer+9)*0.7071}" stroke="#C0677F" stroke-opacity=".5" stroke-width="1" stroke-dasharray="3 3"/>
    <rect x="84" y="84" width="32" height="32" rx="1.5" fill="#1d1a18"/>
    <rect x="84" y="92" width="32" height="4" fill="#C29A4E"/>
    <rect x="96.5" y="102" width="7" height="14" fill="#C29A4E" opacity=".9"/>
    <circle cx="85" cy="115" r="1.8" fill="#7b6a55"/>
  </svg>`;
}

function renderChapters(){
  let html = "";
  PARTS.forEach(p=>{
    html += `<div class="part-head"><p class="label">${esc(p.num)} · ${esc(p.session)}</p>
      <div class="meta"><h2 class="h-display">${esc(p.title)}</h2><span>${countRead(p)}/${p.chapters.length}</span></div></div>
      <ol class="chlist">` + p.chapters.map((c,i)=>`
      <li><button class="ch ${state.read[c.id]?"done":""}" data-open="${c.id}" style="${cv(c)}">
        <span class="no">${i+1}</span>
        <span><span class="tt">${esc(c.title)}</span><span class="ss">${esc(c.summary)}</span></span>
        <span class="tick" aria-label="${state.read[c.id]?"Read":"Not read yet"}">${state.read[c.id]?check:""}</span>
      </button></li>`).join("") + `</ol>`;
  });
  html += `<div class="coming">More will be added as the series continues.</div>`;
  $("#v-chapters").innerHTML = html;
}

let memMode = "all";
function renderMemorise(){
  const got = MEMORISE.filter(m=>state.mem[m.id]).length;
  let lastPart = "", cards = "";
  MEMORISE.forEach(m=>{
    if(m.part!==lastPart){ lastPart=m.part; const p=PARTS.find(x=>x.num===m.part); cards += `<p class="label" style="margin-top:6px">${esc(m.part)} · ${esc(p?p.title:"")}</p>`; }
    cards += `
    <article class="mcard ${state.mem[m.id]?"got":""}">
      <div class="top"><span class="kind">${esc(m.kind)}</span><h4>${esc(m.title)}</h4></div>
      <p class="ar arw ${memMode==="ar"?"blur":""}" data-reveal>${m.ar}</p>
      <p class="enw ${memMode==="en"?"blur":""}" data-reveal>${esc(m.en)}</p>
      <p class="why"><b>Why it matters · </b>${esc(m.why)}</p>
      <div class="foot"><span class="src">${esc(m.ref)}</span>
        <button class="mbtn" data-mem="${m.id}">${state.mem[m.id]?check+"Memorised":"Mark memorised"}</button></div>
    </article>`;
  });
  $("#v-memorise").innerHTML = `
  <div class="mem-stat"><h2 class="h-display">Memorise</h2><span><b>${got}</b> / ${MEMORISE.length}</span></div>

}

      <div class="ditem ${d.asked?"asked":""}">
        <button class="chk" data-ask="${d.id}" aria-label="${d.asked?"Mark as not yet asked":"Mark as asked"}">${check}</button>
        <div class="tx">${esc(d.text)}</div>
        <button class="del" data-del="${d.id}" aria-label="Remove"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </div>`).join("")}</div>`;
  }).join("");
  const asked = state.duas.filter(d=>d.asked).length;
  $("#v-list").innerHTML = `
  <div class="mem-stat"><h2 class="h-display">My Du'as</h2><span>${state.duas.length?`<b>${asked}</b> / ${state.duas.length} asked`:""}</span></div>
  <div class="intro"><span class="kind">From the lecture</span>
    <div>From now, list the things that are heavy on your heart. When you go for Umrah, ask Allah to help you in these matters, to ease your tests and to solve these problems. There is no limit to how much you can ask Allah.</div></div>
  <form class="adder" id="addForm">
    <label class="label" for="duaText">Add something to ask for</label>
    <textarea id="duaText" placeholder="Ya Allah, …"></textarea>
    <div class="prompts">${PROMPTS.map(p=>`<button type="button" data-prompt="${esc(p)}">${esc(p)}</button>`).join("")}</div>
    <div class="row">
      <div class="seg" role="group" aria-label="Who is this for">${Object.keys(WHO).map(k=>`<button type="button" data-who="${k}" aria-pressed="${whoSel===k}">${WHO[k]}</button>`).join("")}</div>
      <button class="btn rose" type="submit">Add</button>
    </div>
  </form>
  ${groups || `<p class="empty">Your list is empty. Tap a prompt above to begin.</p>`}
  ${state.duas.length?`<p class="hint">Tick each one once you have asked for it at the Ḥaram. Your list stays on this phone.</p>`:""}`;
}

/* reader */
let current = null;
function block(b){
  switch(b.t){
    case "p": return `<p>${b.h}</p>`;
    case "h": return `<h3>${b.n?`<span class="badge">${b.n}</span>`:""}<span>${b.h}</span></h3>`;
    case "list": return `<ul>${b.items.map(i=>`<li>${i}</li>`).join("")}</ul>`;
    case "key": return `<div class="key">${b.h}</div>`;
    case "chips": return `<div class="chips">${b.items.map(i=>`<span>${i}</span>`).join("")}</div>`;
    case "all": return `<div class="all">${b.items.map(i=>`<div><b>${i[0]}</b><span>${i[1]}</span></div>`).join("")}</div>`;
    case "yn": return `<div class="yn">${b.items.map(i=>`<div class="${i[0]?"ok":"no"}"><i aria-label="${i[0]?"Allowed":"Not allowed"}">${i[0]?"✓":"✕"}</i><span>${i[1]}</span></div>`).join("")}</div>`;
    case "q": return `<div class="box quran"><span class="kind">Qur'an</span><p class="ar">${b.ar}</p><p class="en">${b.en}</p><span class="src">${b.ref}</span></div>`;
    case "hd": return `<div class="box hadith"><span class="kind">${b.kind||"Hadith"}</span>${b.ar?`<p class="ar">${b.ar}</p>`:""}<p class="en">${b.en}</p>${b.ref?`<span class="src">${b.ref}</span>`:""}</div>`;
    case "dua": return `<div class="box dua"><span class="kind">${b.kind}</span>${b.ar?`<p class="ar">${b.ar}</p>`:""}<p class="en">${b.en}</p></div>`;
    case "story": return `<div class="story"><span class="kind">${b.kind}</span>${b.h}</div>`;
    case "cta": return `<div class="cta"><h4>${b.title}</h4><p>${b.h}</p><div><button class="btn rose" data-tab-go="list">Open my du'a list</button></div></div>`;
    case "cta2": return `<div class="cta"><h4>Your Umrah is complete</h4><p>${b.h}</p></div>`;
    case "steps": return `<ol class="steps">${b.items.map(i=>`<li><b>${i[0]}</b><span>${i[1]}</span></li>`).join("")}</ol>`;
    case "plan": return `<div class="plan">${state.plan.map((v,i)=>`<label class="round" for="rnd${i}"><span class="rn">${i+1}</span><span class="rl">Round ${i+1}</span><select id="rnd${i}" data-round="${i}">${PLAN_OPTS.map(o=>`<option value="${esc(o)}" ${o===v?"selected":""}>${o?esc(o):"Choose…"}</option>`).join("")}</select></label>`).join("")}<p class="hint" style="text-align:left">In every round: <b>Bismillāh, Allāhu Akbar</b> at the Black Stone, and <b>Rabbanā ātinā…</b> between the Yamānī corner and the Black Stone.</p></div>`;
    case "pack": return `<p class="label" style="margin-bottom:-8px">Packing list · tap to tick</p><div class="pack">${PACK.map(p=>`<button data-pack="${esc(p)}" aria-pressed="${!!state.pack[p]}"><i>${check}</i>${esc(p)}</button>`).join("")}</div>`;
  }
  return "";
}
function openChapter(id, replace){
  const c = ALL.find(x=>x.id===id); if(!c) return;
  current = c; state.last = id; S.set("last",id);
  const i = ALL.indexOf(c), prev = ALL[i-1], next = ALL[i+1];
  const r = $("#reader");
  r.setAttribute("style", cv(c));
  r.innerHTML = `
  <div class="r-bar">
    <button class="iconbtn" id="rClose" aria-label="Back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 6l-6 6 6 6"/></svg></button>
    <div class="where">${esc(c.part.num)} · Chapter ${c.idx} of ${c.part.chapters.length}</div>
    <span style="width:40px"></span>
  </div>
  <div class="r-prog"><i id="rProg"></i></div>
  <header class="r-head"><div class="inner"><div class="n">${String(c.idx).padStart(2,"0")}</div><h1>${esc(c.title)}</h1><p>${esc(c.summary)}</p></div></header>
  <article class="r-body">
    ${c.blocks.map(block).join("")}
    <div class="r-end" id="rEnd">
      <p class="done-note">${state.read[c.id]?"You have read this chapter.":"Reaching the end marks this chapter as read."}</p>
      <div class="row">
        ${prev?`<button class="btn ghost" data-open="${prev.id}">← ${esc(prev.title)}</button>`:""}
        ${next?`<button class="btn rose" data-open="${next.id}">${esc(next.title)} →</button>`:`<button class="btn rose" id="rDone">Back to chapters</button>`}
      </div>
    </div>
  </article>`;
  r.hidden = false;
  document.body.style.overflow = "hidden";
  r.scrollTop = state.scroll[id] || 0;
  onReaderScroll();
  if(replace) history.replaceState({reader:id},""); else history.pushState({reader:id},"");
}
function saveScroll(){ const r=$("#reader"); if(current){ state.scroll[current.id]=r.scrollTop; S.set("scroll",state.scroll);} }
function closeReader(fromPop){
  const r = $("#reader");
  if(r.hidden) return;
  saveScroll();
  r.hidden = true; document.body.style.overflow = ""; current = null;
  renderAll();
  if(!fromPop && history.state && history.state.reader) history.back();
}
let scrollT;
function onReaderScroll(){
  const r = $("#reader"); if(r.hidden||!current) return;
  const max = r.scrollHeight - r.clientHeight;
  const pct = max>0 ? Math.min(1, r.scrollTop/max) : 1;
  const bar = $("#rProg"); if(bar) bar.style.width = (pct*100)+"%";
  if(pct>0.97 && !state.read[current.id]){
    state.read[current.id] = true; S.set("read",state.read);
    toast("Chapter marked as read");
    const note = $("#rEnd .done-note"); if(note) note.textContent = "You have read this chapter.";
  }
  clearTimeout(scrollT); scrollT = setTimeout(saveScroll,300);
}

/* swipe between chapters */
let sx=0, sy=0, st=0;
$("#reader").addEventListener("touchstart",e=>{const t=e.touches[0];sx=t.clientX;sy=t.clientY;st=Date.now()},{passive:true});
$("#reader").addEventListener("touchend",e=>{
  if(!current) return;
  const t=e.changedTouches[0], dx=t.clientX-sx, dy=t.clientY-sy;
  if(Date.now()-st<600 && Math.abs(dx)>80 && Math.abs(dy)<50){
    const i=ALL.indexOf(current), to = dx<0 ? ALL[i+1] : ALL[i-1];
    if(to){ saveScroll(); openChapter(to.id,true); }
  }
},{passive:true});

function setTab(t){
  state.tab = t; S.set("tab",t);
  ["home","chapters","memorise","list"].forEach(k=>{ $("#v-"+k).hidden = k!==t; });
  document.querySelectorAll(".tabs button").forEach(b=>b.setAttribute("aria-selected", b.dataset.tab===t));
  window.scrollTo(0,0);
}
function renderAll(){ renderHome(); renderChapters(); renderMemorise(); renderList(); }

let toastT;
function toast(msg){ const el=$("#toast"); el.textContent=msg; el.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>el.hidden=true,1800); }

document.addEventListener("click",e=>{
  const o = e.target.closest("[data-open]");
  if(o){ if(!$("#reader").hidden && current){ saveScroll(); openChapter(o.dataset.open,true); } else openChapter(o.dataset.open); return; }
  const tg = e.target.closest("[data-tab-go]");
  if(tg){ if(!$("#reader").hidden) closeReader(); setTab(tg.dataset.tabGo); return; }
  const tb = e.target.closest(".tabs button");
  if(tb){ setTab(tb.dataset.tab); return; }
  if(e.target.closest("#rClose")){ closeReader(); return; }
  if(e.target.closest("#rDone")){ closeReader(); setTab("chapters"); return; }
  const pk = e.target.closest("[data-pack]");
  if(pk){ const k=pk.dataset.pack; state.pack[k]=!state.pack[k]; if(!state.pack[k]) delete state.pack[k]; S.set("pack",state.pack); pk.setAttribute("aria-pressed",!!state.pack[k]); return; }
  const md = e.target.closest("[data-mode]");
  if(md){ memMode = md.dataset.mode; renderMemorise(); return; }
  const rv = e.target.closest("[data-reveal]");
  if(rv){ rv.classList.toggle("blur"); return; }
  const mm = e.target.closest("[data-mem]");
  if(mm){ const id=mm.dataset.mem; state.mem[id]=!state.mem[id]; if(!state.mem[id]) delete state.mem[id]; S.set("mem",state.mem); renderMemorise(); if(state.mem[id]) toast("Memorised · الحمد لله"); return; }
  const pr = e.target.closest("[data-prompt]");
  if(pr){ const ta=$("#duaText"); ta.value = pr.dataset.prompt + ": "; ta.focus(); ta.setSelectionRange(ta.value.length,ta.value.length); return; }
  const wh = e.target.closest("[data-who]");
  if(wh){ whoSel = wh.dataset.who; document.querySelectorAll("[data-who]").forEach(b=>b.setAttribute("aria-pressed", b.dataset.who===whoSel)); return; }
  const ak = e.target.closest("[data-ask]");
  if(ak){ const d=state.duas.find(x=>x.id===ak.dataset.ask); if(d){d.asked=!d.asked; S.set("duas",state.duas); renderList(); renderHome();} return; }
  const dl = e.target.closest("[data-del]");
  if(dl){ state.duas = state.duas.filter(x=>x.id!==dl.dataset.del); S.set("duas",state.duas); renderList(); renderHome(); return; }
});
document.addEventListener("change",e=>{
  const sel = e.target.closest("[data-round]");
  if(sel){ state.plan[+sel.dataset.round] = sel.value; S.set("plan",state.plan); toast("Round "+(+sel.dataset.round+1)+" saved"); }
});
document.addEventListener("submit",e=>{
  if(e.target.id!=="addForm") return;
  e.preventDefault();
  const v = $("#duaText").value.trim(); if(!v) return;
  state.duas.push({id:"d"+Date.now(), text:v, who:whoSel, asked:false});
  S.set("duas",state.duas); renderList(); renderHome(); toast("Added to your list");
});
$("#reader").addEventListener("scroll",onReaderScroll,{passive:true});
window.addEventListener("popstate",()=>{ if(!$("#reader").hidden) closeReader(true); });

function resetConfirm(show){
  $("#resetWrap").innerHTML = show
    ? `<div class="confirm"><span>Clear read chapters and memorised marks?</span><button class="danger" id="resetYes">Yes, reset</button><button class="mbtn" id="resetNo">Cancel</button></div>`
    : `<button class="danger" id="resetBtn">Reset reading progress</button>`;
}
function openSheet(){ $("#scrim").hidden=false; $("#sheet").hidden=false; resetConfirm(false); }
function closeSheet(){ $("#scrim").hidden=true; $("#sheet").hidden=true; }
$("#openSettings").addEventListener("click",openSheet);
$("#scrim").addEventListener("click",closeSheet);
$("#fsize").addEventListener("input",e=>{ state.fs=+e.target.value; S.set("fs",state.fs); applySize(); });
$("#resetWrap").addEventListener("click",e=>{
  if(e.target.id==="resetBtn") resetConfirm(true);
  else if(e.target.id==="resetNo") resetConfirm(false);
  else if(e.target.id==="resetYes"){ state.read={}; state.mem={}; state.scroll={}; state.last=null; ["read","mem","scroll","last"].forEach(k=>S.set(k,state[k])); renderAll(); resetConfirm(false); closeSheet(); toast("Progress reset"); }
});

applySize(); renderAll(); setTab(state.tab||"home");
if("serviceWorker" in navigator && location.protocol.startsWith("http")){
  window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
}
</script>
</body>
</html>
